<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Night Slip</title>
    <style>
      @font-face {
        font-family: "Press Start 2P";
        src: url("fonts/PressStart2P.ttf") format("truetype");
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --ink: #071013;
        --panel: rgba(10, 17, 19, 0.74);
        --line: rgba(217, 230, 222, 0.2);
        --text: #eef6ef;
        --muted: #a7bdb0;
        --green: #64d89a;
        --red: #f06464;
        --amber: #f0b963;
        --blue: #69a8e8;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #071013;
        color: var(--text);
        touch-action: none;
      }

      body {
        min-height: 100svh;
      }

      button {
        font: inherit;
      }

      .game-shell {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-rows: 1fr;
        overflow: hidden;
        background: #000;
      }

      .stage-wrap {
        position: relative;
        min-height: 0;
        display: grid;
        place-items: center;
        padding: 0;
        overflow: hidden;
      }

      canvas {
        position: relative;
        z-index: 1;
        display: block;
        width: 100vw;
        height: 100svh;
        border: 0;
        border-radius: 0;
        background: #000;
        box-shadow: none;
      }

      .snowfall {
        position: absolute;
        z-index: 2;
        left: 50%;
        top: 50%;
        width: 100vw;
        height: 100svh;
        border-radius: 0;
        overflow: hidden;
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%);
        transition: opacity 240ms ease;
      }

      .snowfall::before,
      .snowfall::after {
        content: "";
        position: absolute;
        left: -12%;
        top: -12%;
        width: 124%;
        height: 124%;
        background-repeat: repeat;
        will-change: background-position;
      }

      .snowfall::before {
        background-image:
          radial-gradient(circle, rgba(255, 255, 255, 0.94) 0 2px, transparent 2.8px),
          radial-gradient(circle, rgba(218, 237, 255, 0.72) 0 1.3px, transparent 2.2px),
          radial-gradient(circle, rgba(255, 255, 255, 0.5) 0 1px, transparent 1.7px);
        background-size:
          83px 97px,
          137px 149px,
          59px 113px;
        background-position:
          9px 17px,
          51px 73px,
          31px 48px;
        animation: snow-fall-before 1.4s linear infinite;
      }

      .snowfall::after {
        background-image:
          radial-gradient(circle, rgba(255, 255, 255, 0.78) 0 1.5px, transparent 2.4px),
          radial-gradient(circle, rgba(224, 242, 255, 0.56) 0 1px, transparent 1.9px),
          radial-gradient(circle, rgba(255, 255, 255, 0.34) 0 0.8px, transparent 1.5px);
        background-size:
          67px 79px,
          109px 131px,
          151px 181px;
        background-position:
          28px 5px,
          84px 41px,
          10px 109px;
        animation: snow-fall-after 2.2s linear infinite;
        animation-delay: -1s;
      }

      body.snow-active .snowfall {
        opacity: 0.82;
      }

      @keyframes snow-fall-before {
        from {
          background-position:
            9px 17px,
            51px 73px,
            31px 48px;
        }
        to {
          background-position:
            9px calc(17px + 97px),
            51px calc(73px + 149px),
            31px calc(48px + 113px);
        }
      }

      @keyframes snow-fall-after {
        from {
          background-position:
            28px 5px,
            84px 41px,
            10px 109px;
        }
        to {
          background-position:
            28px calc(5px + 79px),
            84px calc(41px + 131px),
            10px calc(109px + 181px);
        }
      }

      .overlay {
        position: absolute;
        inset: 0;
        z-index: 5;
        display: grid;
        place-items: center;
        padding: 16px;
        background: rgba(3, 7, 8, 0.48);
        backdrop-filter: blur(10px);
      }

      .overlay[hidden] {
        display: none;
      }

      .dialog {
        width: min(520px, 92vw);
        display: grid;
        gap: 13px;
        padding: 18px;
        border: 1px solid rgba(222, 237, 226, 0.2);
        border-radius: 8px;
        background: rgba(9, 15, 16, 0.88);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
      }

      .dialog h1,
      .dialog p {
        margin: 0;
      }

      .dialog h1 {
        font-size: clamp(1.45rem, 5vw, 2.35rem);
        line-height: 1;
      }

      .dialog p {
        color: #bdd0c3;
        line-height: 1.45;
        font-size: 0.96rem;
      }

      .dialog button,
      .icon-button {
        min-height: 44px;
        border: 1px solid rgba(100, 216, 154, 0.45);
        border-radius: 8px;
        background: #dff9e8;
        color: #091111;
        font-weight: 900;
        cursor: pointer;
      }

      .settings-panel {
        display: grid;
        gap: 12px;
        padding-top: 4px;
        border-top: 1px solid rgba(222, 237, 226, 0.15);
      }

      .volume-row {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 10px;
        color: #bdd0c3;
        font-size: 0.88rem;
      }

      .volume-row span {
        grid-column: 1 / -1;
      }

      .volume-row input[type="range"] {
        grid-column: 1 / -1;
        width: 100%;
        accent-color: #64d89a;
      }

      .dialog button.ghost-button {
        background: transparent;
        border-color: rgba(222, 237, 226, 0.3);
        color: #dff9e8;
        font-weight: 700;
      }

      .controls {
        position: absolute;
        inset: auto 0 0;
        z-index: 4;
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 12px;
        padding:
          0 max(16px, env(safe-area-inset-right)) max(14px, env(safe-area-inset-bottom))
          max(16px, env(safe-area-inset-left));
        pointer-events: none;
      }

      .stick {
        width: 132px;
        height: 132px;
        position: relative;
        border: 1px solid rgba(222, 237, 226, 0.2);
        border-radius: 50%;
        background: rgba(5, 10, 12, 0.44);
        pointer-events: auto;
        box-shadow: inset 0 0 0 18px rgba(255, 255, 255, 0.03);
      }

      .knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        border: 1px solid rgba(238, 246, 239, 0.32);
        background: rgba(223, 249, 232, 0.82);
      }

      .actions {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
        pointer-events: auto;
      }

      .icon-button {
        min-width: 132px;
        height: 58px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 0 16px;
        background: rgba(223, 249, 232, 0.88);
      }

      .icon-button svg {
        width: 22px;
        height: 22px;
        stroke-width: 2.4;
      }

      .icon-button .pause-icon,
      .icon-button.is-pause .skip-icon {
        display: none;
      }

      .icon-button.is-pause .pause-icon {
        display: block;
      }

      .icon-button span {
        font-size: 0.78rem;
        line-height: 1;
        white-space: nowrap;
      }

      .icon-button.is-down {
        transform: translateY(1px);
        background: #9befbd;
      }

      .rotate {
        position: fixed;
        inset: 0;
        z-index: 8;
        display: none;
        place-items: center;
        padding: 18px;
        background: #071013;
        text-align: center;
      }

      .rotate p {
        max-width: 320px;
        margin: 0;
        color: #dbe7dd;
        font-weight: 800;
        line-height: 1.4;
      }

      @media (orientation: portrait) and (max-width: 900px) {
        .rotate {
          display: grid;
        }
      }

      @media (max-height: 470px) {
        canvas {
          width: 100vw;
          height: 100svh;
        }

        .snowfall {
          width: 100vw;
          height: 100svh;
        }

        .stick {
          width: 104px;
          height: 104px;
        }

        .knob {
          width: 42px;
          height: 42px;
        }

        .icon-button {
          min-width: 112px;
          height: 50px;
          gap: 8px;
          padding: 0 12px;
        }

        .icon-button svg {
          width: 18px;
          height: 18px;
        }

        .icon-button span {
          font-size: 0.68rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="game-shell">
      <section class="stage-wrap">
        <canvas id="game" width="1280" height="720" aria-label="Night Slip stealth game"></canvas>
        <div id="snowfall" class="snowfall" aria-hidden="true"></div>

        <div id="overlay" class="overlay">
          <div class="dialog">
            <h1 id="overlayTitle">Night Slip</h1>
            <p id="overlayText">
              Move through the compound and reach the green extraction zone without being seen.
              Guards keep pressure on the main lanes and sprint if they spot you.
            </p>
            <button id="startButton" type="button">Start level</button>
            <div class="settings-panel">
              <label class="volume-row" for="musicVolumeSlider">
                <span>Music volume</span>
                <input type="range" id="musicVolumeSlider" min="0" max="100" value="50" step="1" />
              </label>
              <label class="volume-row" for="voiceVolumeSlider">
                <span>Voice volume</span>
                <input type="range" id="voiceVolumeSlider" min="0" max="100" value="50" step="1" />
              </label>
              <button id="fullscreenButton" class="ghost-button" type="button">Go fullscreen</button>
              <button id="resetGameButton" class="ghost-button" type="button">Reset game</button>
            </div>
          </div>
        </div>

        <div class="controls" aria-label="Game controls">
          <div id="stick" class="stick" aria-label="Movement joystick">
            <div id="knob" class="knob"></div>
          </div>
          <div class="actions">
            <button id="pauseButton" class="icon-button" type="button" aria-label="Skip intro">
              <svg class="skip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <path d="M5 5l10 7-10 7V5z" fill="currentColor" stroke="none"/>
                <path d="M19 5v14" stroke-linecap="round"/>
              </svg>
              <svg class="pause-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                <path d="M8 5v14" stroke-linecap="round"/>
                <path d="M16 5v14" stroke-linecap="round"/>
              </svg>
              <span id="pauseButtonLabel">Skip intro</span>
            </button>
          </div>
        </div>
      </section>
    </main>

    <div class="rotate">
      <p>Rotate your device sideways. Night Slip is tuned for horizontal mobile play.</p>
    </div>

    <script>
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const overlay = document.querySelector("#overlay");
      const overlayTitle = document.querySelector("#overlayTitle");
      const overlayText = document.querySelector("#overlayText");
      const startButton = document.querySelector("#startButton");
      const stick = document.querySelector("#stick");
      const knob = document.querySelector("#knob");
      const pauseButton = document.querySelector("#pauseButton");
      const pauseButtonLabel = document.querySelector("#pauseButtonLabel");
      const voiceVolumeSlider = document.querySelector("#voiceVolumeSlider");
      const resetGameButton = document.querySelector("#resetGameButton");

      const PROGRESS_KEY = "nightslip-progress";
      const VOICE_VOLUME_KEY = "nightslip-voice-volume";
      const MUSIC_VOLUME_KEY = "nightslip-music-volume";
      const FULLSCREEN_INTENT_KEY = "nightslip-fullscreen-intent";
      const MAX_PROGRESS_INDEX = 7;
      const DEFAULT_VOICE_VOLUME = 0.5;
      const DEFAULT_MUSIC_VOLUME = 0.5;
      const MUSIC_OUTPUT_SCALE = 0.32;
      const BUILD_VERSION = "v1.1.3";
      const isEmbedded = window.parent && window.parent !== window;

      function loadProgress() {
        try {
          const raw = parseInt(localStorage.getItem(PROGRESS_KEY), 10);
          return Number.isInteger(raw) && raw >= 0 && raw <= MAX_PROGRESS_INDEX ? raw : 0;
        } catch {
          return 0;
        }
      }
      function saveProgress(index) {
        try {
          localStorage.setItem(PROGRESS_KEY, String(index));
        } catch {}
      }
      function clearProgress() {
        try {
          localStorage.removeItem(PROGRESS_KEY);
        } catch {}
      }
      function rememberFullscreenIntent() {
        try {
          sessionStorage.setItem(FULLSCREEN_INTENT_KEY, "1");
        } catch {}
      }
      function wantsFullscreen() {
        try {
          return sessionStorage.getItem(FULLSCREEN_INTENT_KEY) === "1";
        } catch {
          return false;
        }
      }
      function hasFullscreenMode() {
        return Boolean(document.fullscreenElement || (isEmbedded && wantsFullscreen()));
      }
      function navigateTo(url) {
        if (hasFullscreenMode() || wantsFullscreen()) rememberFullscreenIntent();
        window.location.href = url;
      }

      function loadVoiceVolume() {
        try {
          const raw = localStorage.getItem(VOICE_VOLUME_KEY);
          const value = raw === null ? DEFAULT_VOICE_VOLUME : Number(raw);
          return Number.isFinite(value) ? Math.min(1, Math.max(0, value)) : DEFAULT_VOICE_VOLUME;
        } catch {
          return DEFAULT_VOICE_VOLUME;
        }
      }
      const voiceAudios = [];
      let masterVoiceVolume = loadVoiceVolume();
      function registerVoice(audio, baseVolume) {
        audio.preload = "auto";
        audio._baseVolume = baseVolume;
        audio.volume = baseVolume * masterVoiceVolume;
        voiceAudios.push(audio);
        return audio;
      }
      function applyVoiceVolume(value) {
        masterVoiceVolume = Math.min(1, Math.max(0, value));
        voiceAudios.forEach((audio) => {
          audio.volume = (audio._baseVolume ?? 1) * masterVoiceVolume;
        });
        try {
          localStorage.setItem(VOICE_VOLUME_KEY, String(masterVoiceVolume));
        } catch {}
      }

      function loadMusicVolume() {
        try {
          const raw = localStorage.getItem(MUSIC_VOLUME_KEY);
          const value = raw === null ? DEFAULT_MUSIC_VOLUME : Number(raw);
          return Number.isFinite(value) ? Math.min(1, Math.max(0, value)) : DEFAULT_MUSIC_VOLUME;
        } catch {
          return DEFAULT_MUSIC_VOLUME;
        }
      }
      function getScaledMusicVolume() {
        return masterMusicVolume * MUSIC_OUTPUT_SCALE;
      }
      let masterMusicVolume = loadMusicVolume();
      const musicAudio = new Audio();
      musicAudio.loop = true;
      musicAudio.volume = getScaledMusicVolume();
      let currentMusicSrc = null;
      const levelMusicTracks = {
        1: "music/1.mp3",
        2: "music/2.mp3",
        3: "music/3.mp3",
        4: "music/4.mp3",
        5: "music/5.mp3",
        6: "music/6.mp3",
        7: "music/7.mp3"
      };
      function applyMusicVolume(value) {
        masterMusicVolume = Math.min(1, Math.max(0, value));
        musicAudio.volume = getScaledMusicVolume();
        try {
          localStorage.setItem(MUSIC_VOLUME_KEY, String(masterMusicVolume));
        } catch {}
      }
      function startLevelMusic(levelIdx, options = {}) {
        const src = levelMusicTracks[levelIdx] || null;
        if (!src) {
          musicAudio.pause();
          musicAudio.currentTime = 0;
          currentMusicSrc = null;
          return;
        }
        if (currentMusicSrc !== src) {
          currentMusicSrc = src;
          musicAudio.src = src;
          musicAudio.currentTime = 0;
        } else if (options.restart) {
          musicAudio.currentTime = 0;
        }
        musicAudio.volume = getScaledMusicVolume();
        musicAudio.play().catch(() => {});
      }
      function pauseLevelMusic() {
        musicAudio.pause();
      }
      function resumeLevelMusic() {
        if (currentMusicSrc) musicAudio.play().catch(() => {});
      }

      const W = 1280;
      const H = 720;
      const playerSpeed = 205;
      const guardSpeed = 92;
      const chaseSpeed = playerSpeed * 2.55;
      const guardVisionRange = 310;
      const guardAlertVisionRange = 375;
      const guardVisionSpread = Math.PI * 0.48;
      const guardAlertVisionSpread = Math.PI * 0.78;
      const instantNoticeRange = 92;
      const suspicionGain = 4.3;
      const suspicionDecay = 0.28;
      const chaseThreshold = 0.32;
      const levelScale = 0.62;
      const levelOffsetX = (W - W * levelScale) / 2;
      const levelOffsetY = (H - H * levelScale) / 2;
      const keys = new Set();
      const input = { x: 0, y: 0 };
      const spriteImage = new Image();
      const edSpriteImage = new Image();
      const edPortraitImage = new Image();
      const joeSpriteImage = new Image();

      const edLookingAudio = new Audio("ed/sounds/looking.m4a");

      const edGameOverAudio = new Audio("ed/sounds/game-over.mp4");

      const helenGameOverAudio = new Audio("helen/sounds/game-over.m4a");
      const helenVoiceAudio = new Audio("helen/sounds/helen-voice.m4a");
      const niallVoiceAudio = new Audio("niall/sounds/niall-voice.m4a");
      const niallLookingAudio = new Audio("niall/sounds/all/looking.m4a");
      const niallSightedAudio = new Audio("niall/sounds/all/sighted.m4a");
      const niallGameOverAudio = new Audio("niall/sounds/all/game-over.m4a");
      const joeLookingAudio = new Audio("joe/sounds/looking.m4a");
      const joeSightedAudio = new Audio("joe/sounds/sighted.m4a");
      const joeGameOverAudio = new Audio("joe/sounds/game-over.m4a");
      const danLookingAudio = new Audio("dan/sounds/looking.m4a");
      const danSightedAudios = [
        new Audio("dan/sounds/sighted-1.m4a"),

      ];
      const danGameOverAudio = new Audio("dan/sounds/game-over.m4a");
      const alexLookingAudio = new Audio("alex/sounds/looking.mp3");
      const alexSightedAudio = new Audio("alex/sounds/sighted.mp3");
      const alexGameOverAudio = new Audio("alex/sounds/gameover.mp3");
      const andyLookingAudio = new Audio("andy/sounds/looking.m4a");
      const andySightedAudio = new Audio("andy/sounds/sighted.m4a");
      const andyGameOverAudio = new Audio("andy/sounds/game-over.m4a");
      const wheldonLookingAudios = [1, 2, 3].map((n) => new Audio(`wheldon/sounds/looking-${n}.m4a`));
      const wheldonSightedAudios = [
        new Audio("wheldon/sounds/sighted-1.m4a"),
        new Audio("wheldon/sounds/sighted-2.m4a")
      ];
      const wheldonGameOverAudio = new Audio("wheldon/sounds/game-over.m4a");
      const timLookingAudios = [1, 2, 3, 4].map((n) => new Audio(`tim/sounds/looking-${n}.m4a`));
      const timSightedAudios = [
        new Audio("tim/sounds/sighted-1.m4a"),
        new Audio("tim/sounds/sighted-2.mp4"),
        new Audio("tim/sounds/sighted-3.m4a"),
        new Audio("tim/sounds/sighted-4.m4a")
      ];
      const timGameOverAudios = [1, 2, 3, 4, 5].map((n) => new Audio(`tim/sounds/game-over-${n}.m4a`));
      const levelEndScreens = {
        level1: {
          line: "I'm off to have a long bath and watch Austin Powers.",
          next: "index.html?start=level2",
          getImage: () => edPortraitImage,
          isReady: () => edPortraitReady
        },
        level2: {

          choices: ["I'm buying", "no thanks"],
          next: "index.html?start=level3",
          getImage: () => helenPortraitImage,

        },
        level3: {
          line: "give me the screwdriver. I have a crab to kill.",
          choices: ["please no", "I don't want to die"],

          getImage: () => niallPortraitImage,

        },
        level4: {

          next: "index.html?start=level5",
          getImage: () => helenPortraitImage,
          isReady: () => helenPortraitReady
        }
      };
      let spriteReady = false;
      let edSpriteReady = false;
      let edPortraitReady = false;
      let joeSpriteReady = false;
      let helenSpriteReady = false;
      let helenPortraitReady = false;
      let timSpriteReady = false;
      let danSpriteReady = false;
      let alexSpriteReady = false;
      let andySpriteReady = false;
      let wheldonSpriteReady = false;

      let niallPortraitReady = false;
      let introBackgroundReady = false;

      let bookcaseReady = false;
      let fridgeOpenReady = false;
      let fridgeCrabReady = false;
      spriteImage.src = "niall/niall-sprite.png";
      edSpriteImage.src = "ed/ed-sprite.png";
      edPortraitImage.src = "ed/ed-portrait.png";
      joeSpriteImage.src = "joe/joe.png";
      helenSpriteImage.src = "helen/helen_clean.png";
      helenPortraitImage.src = "helen/helen-portrait.png";
      timSpriteImage.src = "tim/tim_clean.png";
      danSpriteImage.src = "dan/dan-sprites-clean.png";
      alexSpriteImage.src = "alex/alex-sprites-clean.png";
      andySpriteImage.src = "andy/andy-sprites-clean.png";
      wheldonSpriteImage.src = "wheldon/alex-sprite-clean.png";

      function directionFromVector(x, y, fallback = "s") {
        if (Math.hypot(x, y) < 0.04) return fallback;
        const angle = Math.atan2(y, x);
        const directions = ["e", "se", "s", "sw", "w", "nw", "n", "ne"];
        const index = Math.round(((angle + Math.PI * 2) % (Math.PI * 2)) / (Math.PI / 4)) % 8;
        return directions[index];
      }

      function updateActorMotion(actor, dx, dy, dt) {
        const moving = Math.hypot(dx, dy) > 0.1;
        actor.moving = moving;
        if (moving) actor.dir = directionFromVector(dx, dy, actor.dir);
        actor.walk = (actor.walk || 0) + (moving ? dt * 8.5 : dt * 1.8);
      }

        player = { x: activeStart.x, y: activeStart.y, r: 16, caught: false, dir: "s", walk: 0 };

      function parseLevelMode(value) {
        const match = /^level(\d+)$/.exec(value || "");
        if (!match) return null;
        const index = Number(match[1]);
        return Number.isInteger(index) && index > 0 && index < levels.length ? index : null;

        resetStick();
        keys.clear();
        snowmanDialogueSeen = false;

        const params = new URLSearchParams(window.location.search);

        resetLevel();
        startAudioWarning();
      }

      function startIntro() {
        if (thunderTimeout) {
          clearTimeout(thunderTimeout);
          thunderTimeout = null;
        }
        overlay.hidden = true;
        state = "intro";
        activeIntroLine = introLine;
        introStart = performance.now();
        introVoiceStopped = false;
        lastTime = introStart;

        noelVoice.play().catch(() => {});

      function startFridgeIntro(continueMode = "level") {

        fridgeStageStart = performance.now();
        fridgeCrabScaleValue = 1;
        lastTime = fridgeStageStart;

      function finishIntroVoice() {

        noelVoice.currentTime = 0;
      }

      thunderAudio.addEventListener("ended", () => {
        if (state === "thunder") startIntro();
      });

      thunderAudio.addEventListener("error", () => {
        if (state === "thunder") startIntro();
      });

      function canContinueIntro() {
        return (state === "intro" || state === "dialogue") && performance.now() - introStart >= introDuration;
      }

      function continueIntro() {
        if (!canContinueIntro()) return false;
        finishIntroVoice();
        if (state === "dialogue") {
          state = "play";
          lastTime = performance.now();
          syncStageEffects();
        } else {
          startLevel();
        }
        return true;
      }

      function canContinueLevelEnd() {
        return state === "level-end" && performance.now() - introStart >= introDuration;
      }

      function continueLevelEnd() {
        if (!canContinueLevelEnd()) return false;
        edVoiceAudio.pause();
        edVoiceAudio.currentTime = 0;
        helenVoiceAudio.pause();
        helenVoiceAudio.currentTime = 0;
        niallVoiceAudio.pause();
        niallVoiceAudio.currentTime = 0;
        const next = levelEndScreens[activeLevelEndKey]?.next || "index.html?start=level2";
        if (next === "complete") {
          clearProgress();
          navigateTo("pages/ending/index.html");
          return true;
        }
        navigateTo(next);
        return true;
      }

      function showOverlay(title, text, button) {
        overlayTitle.textContent = title;
        overlayText.textContent = text;
        overlayTitle.hidden = !title;
        overlayText.hidden = !text;
        startButton.textContent = button;
        overlay.hidden = false;
        syncStageEffects();
      }

      function syncStageEffects() {
        const snowLevelActive = state === "play" && levels[levelIndex]?.background === "snow";
        document.body.classList.toggle("snow-active", snowLevelActive);
        if (snowLevelActive) {
          windAudio.play().catch(() => {});
        } else {
          windAudio.pause();
          windAudio.currentTime = 0;
        }
      }

      function updateHud() {
        syncStageEffects();
        updateActionButton();
      }

      function rectContains(rect, x, y) {
        return x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h;
      }

      function circleRectOverlap(circle, rect) {
        const cx = Math.max(rect.x, Math.min(circle.x, rect.x + rect.w));
        const cy = Math.max(rect.y, Math.min(circle.y, rect.y + rect.h));
        return Math.hypot(circle.x - cx, circle.y - cy) < circle.r;
      }

      function isBlocked(x, y, r) {
        if (activeWalkBounds) {
          const points = [
            { x, y },
            { x: x - r, y },
            { x: x + r, y },
            { x, y: y - r },
            { x, y: y + r }
          ];
          return points.some((point) => !activeWalkBounds.some((rect) => rectContains(rect, point.x, point.y)));
        }
        return activeWalls.some((wall) => circleRectOverlap({ x, y, r }, wall));
      }

      function moveCircle(entity, dx, dy) {
        const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 6));
        const stepX = dx / steps;
        const stepY = dy / steps;
        for (let i = 0; i < steps; i += 1) {
          if (!isBlocked(entity.x + stepX, entity.y, entity.r)) entity.x += stepX;
          if (!isBlocked(entity.x, entity.y + stepY, entity.r)) entity.y += stepY;
        }
      }

      function travelClear(ax, ay, bx, by, r) {
        const dist = Math.hypot(bx - ax, by - ay);
        const steps = Math.max(6, Math.ceil(dist / 16));
        for (let i = 1; i <= steps; i += 1) {
          const t = i / steps;
          if (isBlocked(ax + (bx - ax) * t, ay + (by - ay) * t, r)) return false;
        }
        return true;
      }

      function lineHitsWall(ax, ay, bx, by) {
        const dist = Math.hypot(bx - ax, by - ay);
        const steps = Math.max(8, Math.ceil(dist / 18));
        for (let i = 1; i < steps; i += 1) {
          const t = i / steps;
          const x = ax + (bx - ax) * t;
          const y = ay + (by - ay) * t;
          if (activeWalls.some((wall) => rectContains(wall, x, y))) return true;
        }
        return false;
      }

      function canSee(guard) {
        const dx = player.x - guard.x;
        const dy = player.y - guard.y;
        const dist = Math.hypot(dx, dy);
        const range = guard.mode === "chase" ? guardAlertVisionRange : guardVisionRange;
        if (dist > range) return false;
        const next = guard.route[guard.target] || guard.route[0];
        const facing = guard.mode === "patrol" ? Math.atan2(next.y - guard.y, next.x - guard.x) : guard.scanAngle;
        const angle = Math.atan2(dy, dx);
        const spread = guard.mode === "chase" ? guardAlertVisionSpread : guardVisionSpread;
        let diff = Math.abs(((angle - facing + Math.PI * 3) % (Math.PI * 2)) - Math.PI);
        if (dist < instantNoticeRange) diff = 0;
        return diff < spread && !lineHitsWall(guard.x, guard.y, player.x, player.y);
      }

      function isAllNiallLevel() {
        return guards.length > 1 && guards.every((guard) => guard.sprite === "niall");
      }

      function alertAllNialls() {
        guards.forEach((guard) => {
          guard.suspicion = Math.max(guard.suspicion, chaseThreshold + 0.01);
          guard.seenAt = { x: player.x, y: player.y };
          guard.mode = "chase";
          guard.scanAngle = Math.atan2(player.y - guard.y, player.x - guard.x);
        });
      }

      function updatePlayer(dt) {
        const mag = Math.hypot(input.x, input.y);
        const speed = playerSpeed;
        let dx = 0;
        let dy = 0;
        if (mag > 0.02) {
          dx = (input.x / mag) * speed * dt;
          dy = (input.y / mag) * speed * dt;
          moveCircle(player, dx, dy);
        }
        updateActorMotion(player, dx, dy, dt);

        const reachedSnowDoor =
          levels[levelIndex].background === "snow" &&
          circleRectOverlap(player, snowDoorTrigger);

        if (reachedSnowDoor || circleRectOverlap(player, activeExtraction)) {
          winLevel();
          return;
        }

        if (
          levels[levelIndex].background === "snow" &&
          !snowmanDialogueSeen &&
          Math.hypot(player.x - snowmanSpot.x, player.y - snowmanSpot.y) < snowmanSpot.r
        ) {
          startSnowmanDialogue();
        }
      }

      function nearestMoveGoal(entity, goal) {
        if (travelClear(entity.x, entity.y, goal.x, goal.y, entity.r)) return goal;

        let best = null;
        for (const point of navPoints) {
          if (!travelClear(entity.x, entity.y, point.x, point.y, entity.r)) continue;
          if (!travelClear(point.x, point.y, goal.x, goal.y, entity.r)) continue;
          const score = Math.hypot(entity.x - point.x, entity.y - point.y) + Math.hypot(goal.x - point.x, goal.y - point.y);
          if (!best || score < best.score) best = { point, score };
        }
        if (best) return best.point;

        for (const first of navPoints) {
          if (!travelClear(entity.x, entity.y, first.x, first.y, entity.r)) continue;
          for (const second of navPoints) {
            if (!travelClear(first.x, first.y, second.x, second.y, entity.r)) continue;
            if (!travelClear(second.x, second.y, goal.x, goal.y, entity.r)) continue;
            const score =
              Math.hypot(entity.x - first.x, entity.y - first.y) +
              Math.hypot(first.x - second.x, first.y - second.y) +
              Math.hypot(goal.x - second.x, goal.y - second.y);
            if (!best || score < best.score) best = { point: first, score };
          }
        }
        return best?.point || goal;
      }

      function updateGuard(guard, dt) {
        if (canSee(guard)) {
          guard.suspicion += dt * suspicionGain;
          guard.seenAt = { x: player.x, y: player.y };
        } else {
          guard.suspicion = Math.max(0, guard.suspicion - dt * suspicionDecay);
        }

        if (guard.suspicion > chaseThreshold) {
          if (guard.mode !== "chase") {
            stopGuardVoiceLines();
            playSpriteSightedAudio(guard.sprite);
          }
          guard.mode = "chase";
          if (isAllNiallLevel()) alertAllNialls();
          alertFlash = 0.12;
        } else if (guard.mode === "chase" && guard.suspicion <= 0 && guard.seenAt) {
          guard.mode = "search";
        }

        let goal;
        let speed = guardSpeed;
        if (guard.mode === "chase") {
          goal = { x: player.x, y: player.y };
          speed = chaseSpeed;
        } else if (guard.mode === "search" && guard.seenAt) {
          goal = guard.seenAt;
          speed = guardSpeed * 1.18 * guard.speedFactor;
          if (Math.hypot(goal.x - guard.x, goal.y - guard.y) < 14) {
            guard.mode = "patrol";
            guard.seenAt = null;
          }
        } else {
          speed = guardSpeed * guard.speedFactor;
          goal = guard.route[guard.target];
          if (Math.hypot(goal.x - guard.x, goal.y - guard.y) < 16) {
            guard.target = (guard.target + guard.patrolDir + guard.route.length) % guard.route.length;
            goal = guard.route[guard.target];
          }
        }

        guard.moveGoal = nearestMoveGoal(guard, goal);
        const dx = guard.moveGoal.x - guard.x;
        const dy = guard.moveGoal.y - guard.y;
        const mag = Math.hypot(dx, dy) || 1;
        const moveX = (dx / mag) * speed * dt;
        const moveY = (dy / mag) * speed * dt;
        const beforeX = guard.x;
        const beforeY = guard.y;
        moveCircle(guard, moveX, moveY);
        if (
          guard.mode === "patrol" &&
          Math.hypot(guard.x - beforeX, guard.y - beforeY) < 0.08 &&
          Math.hypot(goal.x - guard.x, goal.y - guard.y) > 22
        ) {
          guard.patrolDir *= -1;
          guard.target = (guard.target + guard.patrolDir + guard.route.length) % guard.route.length;
        }
        guard.scanAngle = Math.atan2(dy, dx);
        updateActorMotion(guard, moveX, moveY, dt);

        if (Math.hypot(player.x - guard.x, player.y - guard.y) < player.r + guard.r - 2) {
          loseLevel(guard);
        }
      }

      function winLevel() {
        if (levelIndex < levels.length - 1) {
          const completed = levels[levelIndex];
          if (completed.background === "snow") {
            saveProgress(1);
            navigateTo("pages/noel-transform/index.html");
            return;
          }
          if (completed.title === "Level 1") {
            navigateTo("index.html?end=level1");
            return;
          }
          if (completed.title === "Level 2") {
            navigateTo("index.html?end=level2");
            return;
          }
          if (completed.title === "Level 3") {
            navigateTo("index.html?end=level3");
            return;
          }
          if (completed.title === "Level 4") {
            navigateTo("index.html?end=level4");
            return;
          }
          levelIndex += 1;
          saveProgress(levelIndex);
          const nextTitle = levels[levelIndex].title.toLowerCase().replace(" ", "");
          window.history.replaceState(null, "", `?start=${nextTitle}`);
          startLevel();
        } else {
          navigateTo(`index.html?end=level${levelIndex}`);
          return;
        }
      }

      function loseLevel(guard = null) {
        pauseLevelMusic();
        if (guard?.sprite === "helen") {
          caughtSightedAudio = helenSightedAudio;
          caughtGameOverAudio = helenGameOverAudio;
        } else if (guard?.sprite === "joe") {
          caughtSightedAudio = joeSightedAudio;
          caughtGameOverAudio = joeGameOverAudio;
        } else if (guard?.sprite === "tim") {
          caughtSightedAudio = timLastSightedAudio;
          caughtGameOverAudio = timGameOverAudios[timGameOverState.index % timGameOverAudios.length];
          timGameOverState.index += 1;
        } else if (guard?.sprite === "dan") {
          caughtSightedAudio = danLastSightedAudio;
          caughtGameOverAudio = danGameOverAudio;
        } else if (guard?.sprite === "alex") {
          caughtSightedAudio = alexSightedAudio;
          caughtGameOverAudio = alexGameOverAudio;
        } else if (guard?.sprite === "andy") {
          caughtSightedAudio = andySightedAudio;
          caughtGameOverAudio = andyGameOverAudio;
        } else if (guard?.sprite === "wheldon") {
          caughtSightedAudio = wheldonLastSightedAudio;
          caughtGameOverAudio = wheldonGameOverAudio;
        } else if (guard?.sprite === "niall" || !guard?.sprite) {
          caughtSightedAudio = niallSightedAudio;
          caughtGameOverAudio = niallGameOverAudio;
        } else {
          caughtSightedAudio = edSightedAudio;
          caughtGameOverAudio = edGameOverAudio;
        }
        caughtGameOverStarted = false;
        state = "caught";
        caughtStart = performance.now();
      }

      function update(dt) {
        updateActionButton();
        if (state === "fridge-intro") {
          const elapsed = performance.now() - fridgeStageStart;
          if (fridgeStage === 1) {
            fridgeCrabScaleValue = 1 + Math.min(1, elapsed / fridgeCrabDuration);
          }
          if (fridgeStage === 0 && elapsed >= fridgeLineDuration) {
            fridgeStage = 1;
            fridgeStageStart = performance.now();
            fridgeCrabScaleValue = 1;
          } else if (fridgeStage === 1 && elapsed >= fridgeCrabDuration) {
            fridgeStage = 2;
            fridgeStageStart = performance.now();
            fridgeCrabScaleValue = 2;
            noelVoice.currentTime = 0;
            noelVoice.play().catch(() => {});
          } else if (fridgeStage === 2 && elapsed >= fridgeLineDuration) {
            fridgeStage = 3;
            fridgeStageStart = performance.now();
          }
          return;
        }
        if (state === "caught") {
          const elapsed = performance.now() - caughtStart;
          if (!caughtGameOverStarted) {
            const sightedFinished =
              !caughtSightedAudio || caughtSightedAudio.paused || caughtSightedAudio.ended;
            if (elapsed >= 600 && sightedFinished) {
              caughtGameOverStarted = true;
              caughtGameOverAudio.currentTime = 0;
              caughtGameOverAudio.play().catch(() => {});
            }
          } else if (caughtGameOverAudio.ended || caughtGameOverAudio.paused) {
            resetLevel();
            state = "play";
            lastTime = performance.now();
            syncStageEffects();
            startLevelMusic(levelIndex, { restart: true });
          }
          return;
        }
        if (state === "audio-warning") {
          audioWarningDone = true;
          return;
        }
        if (state === "thunder") return;
        if (state === "intro" || state === "dialogue") {
          if (performance.now() - introStart >= introDuration) {
            finishIntroVoice();
          }
          return;
        }
        if (state !== "play") return;
        updatePlayer(dt);
        guards.forEach((guard) => updateGuard(guard, dt));
        alertFlash = Math.max(0, alertFlash - dt);

        if (levelIndex === 1) {
          level1LookingCooldown -= dt;
          if (level1LookingCooldown <= 0) {
            if (playLevelOneLooking()) {
              level1LookingCooldown = patrolLookingGap;
            } else {
              level1LookingCooldown = 0.18;
            }
          }
        }
        if (levelIndex === 2) {
          level2LookingCooldown -= dt;
          if (level2LookingCooldown <= 0) {
            if (playLevelTwoLooking()) {
              level2LookingCooldown = patrolLookingGap;
            } else {
              level2LookingCooldown = 0.18;
            }
          }
        }
        if (levelIndex === 3) {
          level3LookingCooldown -= dt;
          if (level3LookingCooldown <= 0) {
            if (playLevelThreeLooking()) {
              level3LookingCooldown = patrolLookingGap;
            } else {
              level3LookingCooldown = 0.18;
            }
          }
        }
        if (levelIndex === 4) {
          level4LookingCooldown -= dt;
          if (level4LookingCooldown <= 0) {
            if (playLevelFourLooking()) {
              level4LookingCooldown = patrolLookingGap;
            } else {
              level4LookingCooldown = 0.18;
            }
          }
        }
        if (levelIndex === 5) {
          level5LookingCooldown -= dt;
          if (level5LookingCooldown <= 0) {
            if (playLevelFiveLooking()) {
              level5LookingCooldown = patrolLookingGap;
            } else {
              level5LookingCooldown = 0.18;
            }
          }
        }
        if (levelIndex === 6) {
          level6LookingCooldown -= dt;
          if (level6LookingCooldown <= 0) {
            if (playLevelSixLooking()) {
              level6LookingCooldown = patrolLookingGap;
            } else {
              level6LookingCooldown = 0.18;
            }
          }
        }
        if (levelIndex === 7) {
          level7LookingCooldown -= dt;
          if (level7LookingCooldown <= 0) {
            if (playLevelSevenLooking()) {
              level7LookingCooldown = patrolLookingGap;
            } else {
              level7LookingCooldown = 0.18;
            }
          }
        }
        updateHud();
      }

      function drawRect(rect, fill, stroke) {
        ctx.fillStyle = fill;
        ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = 2;
          ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
        }
      }

      function drawBookcaseWall(wall) {
        const isVertical = wall.h > wall.w;
        const visualWall = isVertical
          ? { ...wall, w: wall.w + 20 }
          : { ...wall, h: wall.h + 35 };

        if (!bookcaseReady) {
          drawRect(visualWall, "#3f2617", "rgba(222, 179, 102, 0.24)");
          return;
        }

        const sourceW = bookcaseImage.naturalWidth || bookcaseImage.width;
        const sourceH = bookcaseImage.naturalHeight || bookcaseImage.height;
        const sourceBottomCrop = 40;
        const sourceVisibleH = Math.max(1, sourceH - sourceBottomCrop);

        ctx.save();
        ctx.beginPath();
        ctx.rect(visualWall.x, visualWall.y, visualWall.w, visualWall.h);
        ctx.clip();

        if (isVertical) {
          const tileH = visualWall.w * (sourceVisibleH / sourceW);
          for (let y = visualWall.y; y < visualWall.y + visualWall.h; y += tileH) {
            ctx.drawImage(bookcaseImage, 0, 0, sourceW, sourceVisibleH, visualWall.x, y, visualWall.w, tileH + 1);
          }
        } else {
          const tileW = visualWall.h * (sourceVisibleH / sourceW);
          for (let x = visualWall.x; x < visualWall.x + visualWall.w; x += tileW) {
            ctx.save();
            ctx.translate(x, visualWall.y + visualWall.h);
            ctx.rotate(-Math.PI / 2);
            ctx.drawImage(bookcaseImage, 0, 0, sourceW, sourceVisibleH, 0, 0, visualWall.h, tileW + 1);
            ctx.restore();
          }
        }

        ctx.restore();

        ctx.strokeStyle = "rgba(238, 183, 91, 0.42)";
        ctx.lineWidth = 2;
        ctx.strokeRect(visualWall.x, visualWall.y, visualWall.w, visualWall.h);
      }

      function drawWall(wall) {
        if (wall.decor === "bookcase") {
          drawBookcaseWall(wall);
          return;
        }

        drawRect(wall, "#28322f", "rgba(222, 237, 226, 0.1)");
      }

      function drawSnowBarriers() {
        if (!activeWalkBounds || levels[levelIndex].background !== "snow") return;

        ctx.save();
        activeWalkBounds.forEach((rect) => {
          ctx.fillStyle = "rgba(205, 235, 255, 0.035)";
          ctx.fillRect(rect.x, rect.y, rect.w, rect.h);

          ctx.lineJoin = "round";
          ctx.strokeStyle = "rgba(237, 250, 255, 0.66)";
          ctx.lineWidth = 4;
          ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);

          ctx.strokeStyle = "rgba(92, 174, 231, 0.26)";
          ctx.lineWidth = 8;
          ctx.strokeRect(rect.x + 3, rect.y + 3, rect.w - 6, rect.h - 6);
        });
        ctx.restore();
      }

      function drawPixelFallback(actor, colors) {
        const x = Math.round(actor.x);
        const y = Math.round(actor.y);
        const bob = Math.sin(actor.walk || 0) * 2;
        ctx.fillStyle = "rgba(0, 0, 0, 0.28)";
        ctx.fillRect(x - 15, y + 18, 30, 6);
        ctx.fillStyle = "#1a1621";
        ctx.fillRect(x - 11, y - 24 + bob, 22, 15);
        ctx.fillStyle = "#f0b37d";
        ctx.fillRect(x - 9, y - 10 + bob, 18, 15);
        ctx.fillStyle = colors.shirt;
        ctx.fillRect(x - 10, y + 5 + bob, 20, 19);
        ctx.fillStyle = "#10141f";
        ctx.fillRect(x - 9, y + 24 + bob, 7, 11);
        ctx.fillRect(x + 2, y + 24 - bob, 7, 11);
        ctx.fillStyle = "#101018";
        ctx.fillRect(x - 6, y - 4 + bob, 4, 4);
        ctx.fillRect(x + 3, y - 4 + bob, 4, 4);
      }

      function canDrawImage(image) {
        return image.complete && image.naturalWidth > 0 && image.naturalHeight > 0;
      }

      function drawPrawnActor(actor) {
        ctx.save();
        ctx.imageSmoothingEnabled = true;
        ctx.fillStyle = "rgba(0, 0, 0, 0.34)";
        ctx.fillRect(actor.x - 17, actor.y + 18, 34, 7);

        if (!protagonistReady || !canDrawImage(protagonistImage)) {
          drawPixelFallback(actor, { shirt: "#f47f55" });
          ctx.restore();
          return;
        }

        const direction = actor.dir || "s";
        const row = protagonistRows[direction] ?? protagonistRows.s;
        const frame = actor.moving
          ? Math.floor(actor.walk || 0) % spriteFrameCount
          : Math.floor((actor.walk || 0) * 0.35) % spriteFrameCount;
        const flip = direction.includes("w");
        const targetH = 64;
        const targetW = targetH * (protagonistFrameW / protagonistFrameH);
        const dx = -targetW / 2;
        const dy = actor.y + 23 - targetH;

        ctx.translate(actor.x, 0);
        if (flip) ctx.scale(-1, 1);
        try {
          ctx.drawImage(
            protagonistImage,
            frame * protagonistFrameW,
            row * protagonistFrameH,
            protagonistFrameW,
            protagonistFrameH,
            dx,
            dy,
            targetW,
            targetH
          );
        } catch {
          ctx.resetTransform();
          drawPixelFallback(actor, { shirt: "#f47f55" });
        }
        ctx.restore();
      }

      function drawHumanActor(actor) {
        ctx.save();
        ctx.imageSmoothingEnabled = false;
        ctx.fillStyle = "rgba(0, 0, 0, 0.34)";
        ctx.fillRect(actor.x - 17, actor.y + 18, 34, 7);

        if (!humanProtagonistSheet.isReady() || !canDrawImage(humanProtagonistSheet.image)) {
          drawPixelFallback(actor, { shirt: "#f5a14f" });
          ctx.restore();
          return;
        }

        const direction = actor.dir || "s";
        const row = humanProtagonistSheet.rowMap[direction] ?? humanProtagonistSheet.rowMap.s;
        const sideFacing =
          direction === "e" ||
          direction === "ne" ||
          direction === "se" ||
          direction === "w" ||
          direction === "nw" ||
          direction === "sw";
        const frameStep = Math.floor((actor.walk || 0) * (sideFacing ? humanProtagonistSheet.sideWalkRate : 1));
        const frame = actor.moving
          ? frameStep % humanProtagonistSheet.frameCount
          : Math.floor((actor.walk || 0) * 0.35) % humanProtagonistSheet.frameCount;
        const [sourceX, sourceRight] = humanProtagonistSheet.cols[frame];
        const [sourceY, sourceBottom] = humanProtagonistSheet.rows[row];
        const sourceW = sourceRight - sourceX;
        const sourceH = sourceBottom - sourceY;
        const targetH = humanProtagonistSheet.targetH;
        const targetW = targetH * (humanProtagonistSheet.widthRatio || (sourceW / sourceH));
        const dx = actor.x - targetW / 2;
        const dy = actor.y + 23 - targetH;

        try {
          ctx.drawImage(
            humanProtagonistSheet.image,
            sourceX,
            sourceY,
            sourceW,
            sourceH,
            dx,
            dy,
            targetW,
            targetH
          );
        } catch {
          drawPixelFallback(actor, { shirt: "#f5a14f" });
        }
        ctx.restore();
      }

      function drawActor(actor, kind) {
        const isPlayer = kind === "player";
        if (isPlayer) {
          if (levels[levelIndex].background === "snow") {
            drawHumanActor(actor);
          } else {
            drawPrawnActor(actor);
          }
          return;
        }

        const colors = isPlayer
          ? { shirt: "#64d89a", ring: "#e6ffef" }
          : {
              shirt: actor.mode === "chase" ? "#f06464" : "#f0b963",
              ring: actor.mode === "chase" ? "#ffe1e1" : "#fff1cf"
            };
        const spriteSheet = enemySpriteSheets[actor.sprite] || enemySpriteSheets.niall;
        const direction = actor.dir || "s";
        const row = spriteSheet.rowMap[direction] ?? spriteSheet.rowMap.s;
        const flip = (spriteSheet.flipDirections || []).includes(direction);
        const sideFacing = direction === "e" || direction === "ne" || direction === "se" || direction === "w" || direction === "nw" || direction === "sw";
        const frameStep = Math.floor((actor.walk || 0) * (sideFacing ? (spriteSheet.sideWalkRate || 1.55) : 1));
        const sideFrame = sideFacing && spriteSheet.sideFrames?.length
          ? spriteSheet.sideFrames[frameStep % spriteSheet.sideFrames.length]
          : null;
        const spriteCols = spriteSheet.cols || [];
        const spriteRowsForSheet = spriteSheet.rows || [];
        const frameCount = spriteSheet.frameCount || spriteCols.length || spriteFrameCount;
        const frame = sideFrame ? sideFrame.col : frameStep % frameCount;
        const sourceRow = sideFrame ? sideFrame.row : row;
        ctx.save();
        ctx.imageSmoothingEnabled = false;
        ctx.fillStyle = "rgba(0, 0, 0, 0.34)";
        ctx.fillRect(actor.x - 17, actor.y + 18, 34, 7);

        if (spriteSheet.isReady()) {
          const targetH = isPlayer ? 58 : 68;
          const bob = Math.sin(actor.walk || 0) * 1.5 * (spriteSheet.bobScale ?? 1);
          const sourceCol =
            spriteCols[frame] ||
            spriteCols[frame % spriteCols.length] ||
            [0, spriteSheet.image.width || 1];
          const sourceRowBounds =
            spriteRowsForSheet[sourceRow] ||
            spriteRowsForSheet[sourceRow % spriteRowsForSheet.length] ||
            [0, spriteSheet.image.height || 1];
          const [sourceX, sourceRight] = sourceCol;
          const [sourceY, sourceBottom] = sourceRowBounds;
          const sourceW = sourceRight - sourceX;
          const sourceH = sourceBottom - sourceY;
          const targetW = targetH * (spriteSheet.widthRatio || (sourceW / sourceH));
          ctx.translate(actor.x, 0);
          if (flip) {
            ctx.scale(-1, 1);
          }
          ctx.drawImage(
            spriteSheet.image,
            sourceX,
            sourceY,
            sourceW,
            sourceH,
            -targetW / 2,
            actor.y - targetH / 2 - 8 + bob,
            targetW,
            targetH
          );
        } else {
          drawPixelFallback(actor, colors);
        }

        ctx.restore();
      }

      function drawDefaultBackground() {
        ctx.fillStyle = "#101817";
        ctx.fillRect(0, 0, W, H);

        ctx.strokeStyle = "rgba(216, 230, 222, 0.055)";
        ctx.lineWidth = 1;
        for (let x = 40; x < W; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, H);
          ctx.stroke();
        }
        for (let y = 40; y < H; y += 40) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y);
          ctx.stroke();
        }
      }

      function drawImageBackground(image, ready) {
        if (!ready) {
          drawDefaultBackground();
          return;
        }

        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, W, H);

        const imageW = image.naturalWidth || image.width;
        const imageH = image.naturalHeight || image.height;
        const scale = Math.max(W / imageW, H / imageH);
        const drawW = imageW * scale;
        const drawH = imageH * scale;
        const drawX = (W - drawW) / 2;
        const drawY = (H - drawH) / 2;
        ctx.drawImage(image, drawX, drawY, drawW, drawH);
      }

      function drawBackground() {
        const background = levels[levelIndex].background;
        if (background === "snow") {
          drawImageBackground(introBackgroundImage, introBackgroundReady);
        } else if (background === "level1") {
          drawImageBackground(level1BackgroundImage, level1BackgroundReady);
        } else if (background === "level2") {
          drawImageBackground(level2BackgroundImage, level2BackgroundReady);
        } else if (background === "level3") {
          drawImageBackground(level3BackgroundImage, level3BackgroundReady);
        } else {
          drawDefaultBackground();
        }
      }

      function drawHeadphonesIcon(x, y, size) {
        ctx.save();
        ctx.strokeStyle = "#f4f4f4";
        ctx.lineWidth = 8;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.arc(x, y, size * 0.34, Math.PI * 1.05, Math.PI * 1.95);
        ctx.stroke();
        ctx.fillStyle = "#f4f4f4";
        ctx.fillRect(x - size * 0.43, y - size * 0.04, size * 0.16, size * 0.34);
        ctx.fillRect(x + size * 0.27, y - size * 0.04, size * 0.16, size * 0.34);
        ctx.restore();
      }

      function drawAudioWarning() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, W, H);
        drawBuildNumber();
        drawHeadphonesIcon(W / 2, 185, 170);

        ctx.fillStyle = "#f4f4f4";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "22px 'Press Start 2P', monospace";

        ctx.fillText("AUDIO EXPERIENCE", W / 2, 378);
        ctx.font = "18px 'Press Start 2P', monospace";
        ctx.fillText("PLEASE PLAY WITH HEADPHONES", W / 2, 455);
        ctx.fillText("AND GO FULLSCREEN", W / 2, 505);
        ctx.font = "13px 'Press Start 2P', monospace";
        ctx.fillText("YOU CAN MAKE THE GAME FULL SCREEN", W / 2, 548);
        ctx.fillText("AGAIN IN THE MENU", W / 2, 588);

        ctx.font = "14px 'Press Start 2P', monospace";

      function drawBuildNumber() {
        ctx.save();
        ctx.font = "10px 'Press Start 2P', monospace";
        ctx.textAlign = "right";
        ctx.textBaseline = "top";
        ctx.fillStyle = "rgba(223, 249, 232, 0.78)";

      }

      function drawProgressCounter() {
        const label = `${levelIndex + 1}/${levels.length}`;
        const versionLabel = BUILD_VERSION;
        ctx.save();
        ctx.font = "14px 'Press Start 2P', monospace";
        ctx.textAlign = "right";
        ctx.textBaseline = "top";
        const padding = 14;
        const textWidth = Math.max(ctx.measureText(label).width, ctx.measureText(versionLabel).width);
        const boxW = textWidth + padding * 2;
        const boxH = 62;
        const x = W - 20 - boxW;
        const y = 20;
        ctx.fillStyle = "rgba(0, 0, 0, 0.58)";
        ctx.fillRect(x, y, boxW, boxH);
        ctx.strokeStyle = "rgba(223, 249, 232, 0.48)";
        ctx.lineWidth = 2;
        ctx.strokeRect(x, y, boxW, boxH);
        ctx.fillStyle = "#dff9e8";
        ctx.fillText(label, W - 20 - padding, y + 10);
        ctx.font = "10px 'Press Start 2P', monospace";
        ctx.fillStyle = "#a7bdb0";
        ctx.fillText(versionLabel, W - 20 - padding, y + 38);
        ctx.restore();
      }

      function drawThunderCue() {
        const flash = Math.sin(performance.now() / 85) > 0.8;
        ctx.fillStyle = flash ? "#f4f4f4" : "#000";
        ctx.fillRect(0, 0, W, H);
      }

      function drawIntro() {
        const elapsed = Math.min(introDuration, performance.now() - introStart);
        const progress = elapsed / introDuration;
        const chars = Math.min(activeIntroLine.length, Math.ceil(progress * activeIntroLine.length));
        const text = activeIntroLine.slice(0, chars);
        const introComplete = chars >= activeIntroLine.length;

        if (introBackgroundReady) {
          const scale = Math.max(W / introBackgroundImage.width, H / introBackgroundImage.height);
          const bgW = introBackgroundImage.width * scale;
          const bgH = introBackgroundImage.height * scale;
          ctx.drawImage(introBackgroundImage, (W - bgW) / 2, (H - bgH) / 2, bgW, bgH);
          ctx.fillStyle = "rgba(0, 0, 0, 0.48)";
          ctx.fillRect(0, 0, W, H);
        } else {
          ctx.fillStyle = "#000";
          ctx.fillRect(0, 0, W, H);
        }

        const portraitSize = 430;
        const portraitX = 150;
        const portraitY = (H - portraitSize) / 2;
        if (noelReady) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(portraitX, portraitY, portraitSize, portraitSize);
          ctx.clip();
          ctx.drawImage(noelImage, portraitX, portraitY, portraitSize, portraitSize);
          ctx.restore();
        }

        ctx.fillStyle = "#f4f4f4";
        ctx.font = "24px 'Press Start 2P', monospace";
        ctx.textBaseline = "top";
        const textX = 650;
        const textY = 285;
        const maxWidth = 480;
        const words = text.split(" ");
        let line = "";
        let y = textY;
        words.forEach((word, index) => {
          const candidate = line ? `${line} ${word}` : word;
          if (ctx.measureText(candidate).width > maxWidth && line) {
            ctx.fillText(line, textX, y);
            y += 42;
            line = word;
          } else {
            line = candidate;
          }
          if (index === words.length - 1 && line) ctx.fillText(line, textX, y);
        });

        if (!introComplete && Math.floor(elapsed / 180) % 2 === 0) {
          const cursorX = textX + Math.min(maxWidth, ctx.measureText(line).width + 12);
          ctx.fillRect(cursorX, y + 2, 5, 24);
        }

        if (introComplete) {
          const pulse = Math.floor(performance.now() / 420) % 2 === 0;
          ctx.fillStyle = pulse ? "rgba(244, 244, 244, 0.16)" : "rgba(244, 244, 244, 0.09)";
          ctx.fillRect(introButton.x, introButton.y, introButton.w, introButton.h);
          ctx.strokeStyle = "#f4f4f4";
          ctx.lineWidth = 4;
          ctx.strokeRect(introButton.x, introButton.y, introButton.w, introButton.h);
          ctx.fillStyle = "#f4f4f4";
          ctx.font = "20px 'Press Start 2P', monospace";
          ctx.textBaseline = "middle";
          ctx.textAlign = "center";
          ctx.fillText(
            "PRESS TO CONTINUE",
            introButton.x + introButton.w / 2,
            introButton.y + introButton.h / 2 + 1
          );
          ctx.textAlign = "start";
        }
      }

      function drawLevelEnd() {
        const screen = levelEndScreens[activeLevelEndKey] || levelEndScreens.level1;
        const lineText = screen.line;
        const elapsed = Math.min(introDuration, performance.now() - introStart);
        const progress = elapsed / introDuration;
        const chars = Math.min(lineText.length, Math.ceil(progress * lineText.length));
        const text = lineText.slice(0, chars);
        const complete = chars >= lineText.length;

        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, W, H);

        const portraitSize = 430;
        const portraitX = 150;
        const portraitY = (H - portraitSize) / 2;
        const portraitImage = screen.getImage();
        if (screen.isReady()) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(portraitX, portraitY, portraitSize, portraitSize);
          ctx.clip();
          ctx.drawImage(portraitImage, portraitX, portraitY, portraitSize, portraitSize);
          ctx.restore();
        }

        ctx.fillStyle = "#f4f4f4";
        ctx.font = "24px 'Press Start 2P', monospace";
        ctx.textBaseline = "top";
        const textX = 650;
        const textY = 245;
        const maxWidth = 520;
        const words = text.split(" ");
        let line = "";
        let y = textY;
        words.forEach((word, index) => {
          const candidate = line ? `${line} ${word}` : word;
          if (ctx.measureText(candidate).width > maxWidth && line) {
            ctx.fillText(line, textX, y);
            y += 42;
            line = word;
          } else {
            line = candidate;
          }
          if (index === words.length - 1 && line) ctx.fillText(line, textX, y);
        });

        if (!complete && Math.floor(elapsed / 180) % 2 === 0) {
          const cursorX = textX + Math.min(maxWidth, ctx.measureText(line).width + 12);
          ctx.fillRect(cursorX, y + 2, 5, 24);
        }

        if (complete) {
          const choices = screen.choices || null;
          const pulse = Math.floor(performance.now() / 420) % 2 === 0;
          const buttons = choices ? levelEndChoiceButtons : [introButton];
          buttons.forEach((button, index) => {
            const label = choices ? choices[index] : "PRESS TO CONTINUE";
            ctx.fillStyle = pulse ? "rgba(244, 244, 244, 0.16)" : "rgba(244, 244, 244, 0.09)";
            ctx.fillRect(button.x, button.y, button.w, button.h);
            ctx.strokeStyle = "#f4f4f4";
            ctx.lineWidth = 4;
            ctx.strokeRect(button.x, button.y, button.w, button.h);
            ctx.fillStyle = "#f4f4f4";
            ctx.font = choices ? "16px 'Press Start 2P', monospace" : "20px 'Press Start 2P', monospace";
            ctx.textBaseline = "middle";
            ctx.textAlign = "center";
            ctx.fillText(label.toUpperCase(), button.x + button.w / 2, button.y + button.h / 2 + 1);
            ctx.textAlign = "start";
          });
        }
      }

      function drawFridgeIntro() {
        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, W, H);

        const imgSize = 430;
        const imgX = 150;
        const imgY = (H - imgSize) / 2;
        if (fridgeOpenReady) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(imgX, imgY, imgSize, imgSize);
          ctx.clip();
          const bgScale = Math.max(imgSize / fridgeOpenImage.width, imgSize / fridgeOpenImage.height);
          const bgW = fridgeOpenImage.width * bgScale;
          const bgH = fridgeOpenImage.height * bgScale;
          ctx.drawImage(
            fridgeOpenImage,
            imgX + (imgSize - bgW) / 2,
            imgY + (imgSize - bgH) / 2,
            bgW,
            bgH
          );
          if (fridgeStage >= 1 && fridgeCrabReady) {
            const baseCrabSize = imgSize * 0.4;
            const crabSize = baseCrabSize * fridgeCrabScaleValue;
            const crabX = imgX + imgSize / 2 - crabSize / 2;
            const crabY = imgY + imgSize / 2 - crabSize / 2;
            ctx.drawImage(fridgeCrabImage, crabX, crabY, crabSize, crabSize);
          }
          ctx.restore();
        }

        const line = fridgeStage < 2 ? fridgeLine1 : fridgeLine2;
        let text = line;
        if (fridgeStage === 0 || fridgeStage === 2) {
          const elapsed = performance.now() - fridgeStageStart;
          const progress = Math.min(1, elapsed / fridgeLineDuration);
          const chars = Math.min(line.length, Math.ceil(progress * line.length));
          text = line.slice(0, chars);
        }

        ctx.fillStyle = "#f4f4f4";
        ctx.font = "24px 'Press Start 2P', monospace";
        ctx.textBaseline = "top";
        const textX = 650;
        const textY = 285;
        const maxWidth = 480;
        const words = text.split(" ");
        let renderLine = "";
        let y = textY;
        words.forEach((word, index) => {
          const candidate = renderLine ? `${renderLine} ${word}` : word;
          if (ctx.measureText(candidate).width > maxWidth && renderLine) {
            ctx.fillText(renderLine, textX, y);
            y += 42;
            renderLine = word;
          } else {
            renderLine = candidate;
          }
          if (index === words.length - 1 && renderLine) ctx.fillText(renderLine, textX, y);
        });

        const typing = fridgeStage === 0 || fridgeStage === 2;
        if (typing && text.length < line.length && Math.floor(performance.now() / 180) % 2 === 0) {
          const cursorX = textX + Math.min(maxWidth, ctx.measureText(renderLine).width + 12);
          ctx.fillRect(cursorX, y + 2, 5, 24);
        }

        if (fridgeStage === 3) {
          const pulse = Math.floor(performance.now() / 420) % 2 === 0;
          ctx.fillStyle = pulse ? "#f4f4f4" : "rgba(244, 244, 244, 0.5)";
          ctx.font = "18px 'Press Start 2P', monospace";
          ctx.fillText("[Tap anywhere to continue]", textX, y + 56);
        }
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        if (state === "audio-warning") {
          drawAudioWarning();
          return;
        }
        if (state === "caught") {
          const progress = Math.min(1, (performance.now() - caughtStart) / 600);
          ctx.fillStyle = `rgba(0,0,0,${progress})`;
          ctx.fillRect(0, 0, W, H);
          return;
        }
        if (state === "thunder") {
          drawThunderCue();
          return;
        }
        if (state === "level-end") {
          drawLevelEnd();
          return;
        }
        if (state === "fridge-intro") {
          drawFridgeIntro();
          return;
        }
        if (state === "intro" || state === "dialogue") {
          drawIntro();
          return;
        }
        drawBackground();

        const isSnowLevel = levels[levelIndex].background === "snow";
        activeWalls.forEach(wall => { if (wall.decor === "bookcase") drawBookcaseWall(wall); });

        guards.forEach((guard) => {
          const alert = guard.mode === "chase";
          const range = alert ? guardAlertVisionRange : guardVisionRange;
          const spread = alert ? guardAlertVisionSpread : guardVisionSpread;
          ctx.save();
          ctx.translate(guard.x, guard.y);
          ctx.rotate(guard.scanAngle);
          const cone = ctx.createRadialGradient(0, 0, 20, 0, 0, range);
          cone.addColorStop(0, alert ? "rgba(240, 100, 100, 0.22)" : "rgba(240, 185, 99, 0.18)");
          cone.addColorStop(1, "rgba(240, 185, 99, 0)");
          ctx.fillStyle = cone;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, range, -spread, spread);
          ctx.closePath();
          ctx.fill();
          ctx.restore();

          drawActor(guard, "guard");

          if (guard.suspicion > 0) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.58)";
            ctx.fillRect(guard.x - 23, guard.y - 34, 46, 6);
            ctx.fillStyle = alert ? "#f06464" : "#f0b963";
            ctx.fillRect(guard.x - 23, guard.y - 34, 46 * Math.min(1, guard.suspicion), 6);
          }
        });

        drawActor(player, "player");
        if (alertFlash > 0) {
          ctx.fillStyle = `rgba(240, 100, 100, ${alertFlash * 1.6})`;
          ctx.fillRect(0, 0, W, H);
        }
        drawProgressCounter();
      }

      function frame(now) {
        const dt = Math.min(0.033, (now - lastTime) / 1000 || 0);
        lastTime = now;
        stick.style.pointerEvents = state === "play" ? "auto" : "none";
        try {
          update(dt);
          draw();
        } catch (error) {
          console.error("Frame error", error);
        }
        requestAnimationFrame(frame);
      }

      function setStickFromPoint(clientX, clientY) {
        const rect = stick.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const max = rect.width * 0.34;
        const dx = clientX - cx;
        const dy = clientY - cy;
        const mag = Math.hypot(dx, dy);
        const clamped = Math.min(max, mag);
        const nx = mag ? dx / mag : 0;
        const ny = mag ? dy / mag : 0;
        input.x = (nx * clamped) / max;
        input.y = (ny * clamped) / max;
        knob.style.transform = `translate(calc(-50% + ${nx * clamped}px), calc(-50% + ${ny * clamped}px))`;
      }

      function resetStick() {
        input.x = 0;
        input.y = 0;
        activeStickPointerId = null;
        knob.style.transform = "translate(-50%, -50%)";
      }

      stick.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        activeStickPointerId = event.pointerId;
        try { stick.setPointerCapture(event.pointerId); } catch {}
        setStickFromPoint(event.clientX, event.clientY);
      });
      stick.addEventListener("pointermove", (event) => {
        if (event.pointerId !== activeStickPointerId) return;
        event.preventDefault();
        setStickFromPoint(event.clientX, event.clientY);
      });
      stick.addEventListener("pointerup", (event) => {
        if (event.pointerId === activeStickPointerId) resetStick();
      });
      stick.addEventListener("pointercancel", (event) => {
        if (event.pointerId === activeStickPointerId) resetStick();
      });

      pauseButton.addEventListener("click", () => {
        if (canSkipIntroFromActionButton()) {
          navigateTo("index.html?start=level1");
          return;
        }
        if (state !== "play") return;
        resetStick();
        keys.clear();
        pauseLevelMusic();
        state = "paused";
        showOverlay("", "", "Resume");
      });

      startButton.addEventListener("click", () => {
        if (state === "paused") {
          overlay.hidden = true;
          resumeLevelMusic();
          state = "play";
          lastTime = performance.now();
          updateHud();
          return;
        }
        if (state === "menu" && levelIndex === 0) {
          startAudioWarning();
          return;
        }
        startLevel();
      });

      const musicVolumeSlider = document.querySelector("#musicVolumeSlider");
      musicVolumeSlider.value = String(Math.round(masterMusicVolume * 100));
      musicVolumeSlider.addEventListener("input", () => {
        applyMusicVolume(Number(musicVolumeSlider.value) / 100);
      });

      voiceVolumeSlider.value = "50";
      voiceVolumeSlider.addEventListener("input", () => {
        applyVoiceVolume(Number(voiceVolumeSlider.value) / 100);
      });

      resetGameButton.addEventListener("click", () => {
        clearProgress();
        navigateTo("index.html");
      });

      const fullscreenButton = document.querySelector("#fullscreenButton");
      function requestFullscreenMode() {
        rememberFullscreenIntent();
        if (isEmbedded) {
          window.parent.postMessage({ type: "nightslip-request-fullscreen" }, "*");
          return Promise.resolve();
        }
        if (document.fullscreenElement) return Promise.resolve();
        return document.documentElement.requestFullscreen().catch(() => {});
      }
      function restoreFullscreenMode() {
        if (wantsFullscreen() && !hasFullscreenMode()) requestFullscreenMode();
      }
      function updateFullscreenButton() {
        fullscreenButton.textContent = "Go fullscreen";
        fullscreenButton.hidden = hasFullscreenMode();
      }
      fullscreenButton.addEventListener("click", () => {
        if (!hasFullscreenMode()) {
          requestFullscreenMode();
        }
      });
      document.addEventListener("fullscreenchange", updateFullscreenButton);
      window.addEventListener("pointerup", restoreFullscreenMode);
      window.addEventListener("keyup", restoreFullscreenMode);

      function canvasPoint(event) {
        const bounds = canvas.getBoundingClientRect();
        return {
          x: ((event.clientX - bounds.left) / bounds.width) * W,
          y: ((event.clientY - bounds.top) / bounds.height) * H
        };
      }

      canvas.addEventListener("pointerdown", (event) => {
        if (state === "audio-warning" && audioWarningDone) {
          event.preventDefault();
          if (!hasFullscreenMode()) {
            requestFullscreenMode();
            return;
          }
          startThunderCue();
          return;
        }
        const { x, y } = canvasPoint(event);
        if (state === "level-end") {
          const screen = levelEndScreens[activeLevelEndKey] || levelEndScreens.level1;
          const buttons = screen.choices ? levelEndChoiceButtons : [introButton];
          if (canContinueLevelEnd() && (!screen.choices || buttons.some((button) => rectContains(button, x, y)))) {
            event.preventDefault();
            continueLevelEnd();
          }
          return;
        }
        if (state === "fridge-intro") {
          if (fridgeStage === 3) {
            event.preventDefault();
            continueFridgeIntro();
          }
          return;
        }
        if (state !== "intro" && state !== "dialogue") return;
        if (canContinueIntro()) {
          event.preventDefault();
          continueIntro();
        }
      });

      window.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        if (state === "audio-warning" && audioWarningDone && (key === "enter" || key === " ")) {
          event.preventDefault();
          if (!hasFullscreenMode()) {
            requestFullscreenMode();
            return;
          }
          startThunderCue();
          return;
        }
        if (state === "level-end" && (key === "enter" || key === " ")) {
          event.preventDefault();
          continueLevelEnd();
          return;
        }
        if ((state === "intro" || state === "dialogue") && (key === "enter" || key === " ")) {
          event.preventDefault();
          continueIntro();
          return;
        }
        if (state === "fridge-intro") {
          if (fridgeStage === 3) {
            event.preventDefault();
            continueFridgeIntro();
          }
          return;
        }
        keys.add(key);
        updateKeyboardVector();
      });

      window.addEventListener("keyup", (event) => {
        const key = event.key.toLowerCase();
        keys.delete(key);
        updateKeyboardVector();
      });

      function updateKeyboardVector() {
        let x = 0;
        let y = 0;
        if (keys.has("arrowleft") || keys.has("a")) x -= 1;
        if (keys.has("arrowright") || keys.has("d")) x += 1;
        if (keys.has("arrowup") || keys.has("w")) y -= 1;
        if (keys.has("arrowdown") || keys.has("s")) y += 1;
        if (x || y) {
          input.x = x;
          input.y = y;
        } else if (!document.pointerLockElement) {
          resetStick();
        }
      }

      bootGame();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
