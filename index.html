<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Night Slip</title>
    <meta name="description" content="Night Slip - a stealth game by Max Bye." />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #gameFrame {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }
    </style>
  </head>
  <body>
    <!--
      Fullscreen-owning shell. The game and its cutscenes are separate documents
      that navigate the iframe; native fullscreen is per-document and cannot
      survive a top-level navigation, so the game itself would drop out of
      fullscreen on every level/cutscene transition. This wrapper owns fullscreen
      on ITS document (which never navigates) and drives the game via the
      nightslip-* postMessage protocol the game already speaks when embedded.
    -->
    <iframe
      id="gameFrame"
      src="game.html"
      title="Night Slip"
      allow="fullscreen; autoplay; gamepad"
      allowfullscreen
    ></iframe>
    <script>
      const frame = document.getElementById("gameFrame");

      function isFullscreen() {
        return Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      }

      function broadcastState() {
        frame.contentWindow?.postMessage(
          { type: "nightslip-fullscreen-state", fullscreen: isFullscreen() },
          "*"
        );
      }

      function enterFullscreen() {
        if (isFullscreen()) return;
        const el = document.documentElement;
        const req = el.requestFullscreen || el.webkitRequestFullscreen;
        // Runs inside the message handler; same-origin user activation from the
        // tap inside the iframe propagates up to us, so this is a valid request.
        req?.call(el)?.catch?.(() => {});
      }

      // The game (and every cutscene page) posts this when the player taps the
      // "tap to go fullscreen" prompt or otherwise wants fullscreen.
      window.addEventListener("message", (event) => {
        if (event.source !== frame.contentWindow) return;
        if (event.data?.type === "nightslip-request-fullscreen") enterFullscreen();
        if (event.data?.type === "nightslip-refresh-wrapper") {
          window.location.reload();
        }
        if (event.data?.type === "nightslip-navigate-frame" && typeof event.data.url === "string") {
          frame.src = event.data.url;
        }
      });

      // Tell the game our fullscreen state on first load, on every change, and
      // whenever the iframe navigates to a new document (level/cutscene swap).
      document.addEventListener("fullscreenchange", broadcastState);
      document.addEventListener("webkitfullscreenchange", broadcastState);
      frame.addEventListener("load", broadcastState);
    </script>
  </body>
</html>
