<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fridge</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .scene {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 3vw;
      width: 100%;
      padding: 0 4vw;
      box-sizing: border-box;
    }

    .stage {
      position: relative;
      flex-shrink: 0;
      width: min(52vw, 465px);
      height: min(80vh, 675px);
    }

    .fridge {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      image-rendering: pixelated;
    }

    .fridge-0 {
      z-index: 1;
    }

    .fridge-1 {
      z-index: 2;
      animation: fadeThird 6s linear forwards;
    }

    .fridge-2 {
      z-index: 3;
      animation: fadeSecond 4s linear forwards;
    }

    .fridge-3 {
      z-index: 4;
      animation: fadeFirst 2s linear forwards;
    }

    .rei {
      flex-shrink: 0;
      width: min(30vw, 390px);
      max-height: 80vh;
      object-fit: contain;
      object-position: bottom;
      align-self: flex-end;
      image-rendering: pixelated;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 500ms linear, transform 500ms linear;
    }

    .rei.visible {
      opacity: 0.9;
      transform: translateY(0);
    }

    .continue-button {
      position: fixed;
      right: max(24px, env(safe-area-inset-right));
      bottom: max(24px, env(safe-area-inset-bottom));
      z-index: 10;
      border: 2px solid rgba(255, 255, 255, 0.86);
      border-radius: 8px;
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.72);
      color: #f7f7f7;
      font: 700 14px system-ui, sans-serif;
      letter-spacing: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms linear;
    }

    .continue-button.visible {
      opacity: 1;
      pointer-events: auto;
    }

    @keyframes fadeFirst {
      0%,
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes fadeSecond {
      0%,
      75% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes fadeThird {
      0%,
      83.333% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <div class="scene">
    <main class="stage" aria-label="Fridge opening sequence">
      <img class="fridge fridge-0" src="../../fridge/fridge-0-clean.png" alt="" loading="eager" decoding="async" fetchpriority="high" />
      <img class="fridge fridge-1" src="../../fridge/fridge-1-clean.png" alt="" loading="eager" decoding="async" />
      <img class="fridge fridge-2" src="../../fridge/fridge-2-clean.png" alt="" loading="eager" decoding="async" />
      <img class="fridge fridge-3" src="../../fridge/fridge-3-clean.png" alt="" loading="eager" decoding="async" />
    </main>
    <img class="rei" src="../../fridge/rei.png" alt="" loading="eager" decoding="async" />
  </div>
  <button class="continue-button" type="button">Continue</button>
  <script>
    const fridgeCloseAudio = new Audio("../../fridge/sounds/fridge-close.mp3");
    const bungAudio = new Audio("../../fridge/sounds/bung.mp3");
    const rei = document.querySelector(".rei");
    const continueButton = document.querySelector(".continue-button");
    const FULLSCREEN_INTENT_KEY = "nightslip-fullscreen-intent";
    const PENDING_FRAME_URL_KEY = "nightslip-pending-frame-url";
    const isEmbedded = window.parent && window.parent !== window;
    function rememberFullscreenIntent() { try { sessionStorage.setItem(FULLSCREEN_INTENT_KEY, "1"); } catch {} }
    function wantsFullscreen() { try { return sessionStorage.getItem(FULLSCREEN_INTENT_KEY) === "1"; } catch { return false; } }
    // Wrapper reports its fullscreen state via postMessage; null = old wrapper.
    let parentFullscreen = null;
    window.addEventListener("message", (event) => { if (!isEmbedded || event.source !== window.parent) return; if (event.data?.type === "nightslip-fullscreen-state") parentFullscreen = Boolean(event.data.fullscreen); });
    function hasFullscreenMode() { if (document.fullscreenElement) return true; if (!isEmbedded) return false; return parentFullscreen !== null ? parentFullscreen : wantsFullscreen(); }
    function requestFullscreenMode() { if (isEmbedded) { window.parent.postMessage({ type: "nightslip-request-fullscreen" }, "*"); return Promise.resolve(); } if (document.fullscreenElement) return Promise.resolve(); return document.documentElement.requestFullscreen().catch(() => {}); }
    function restoreFullscreenMode() { if (wantsFullscreen() && !hasFullscreenMode()) requestFullscreenMode(); }
    function navigateTo(url) {
      if (hasFullscreenMode() || wantsFullscreen()) rememberFullscreenIntent();
      window.location.href = url;
    }
    function navigateFrameTo(url) {
      if (hasFullscreenMode() || wantsFullscreen()) rememberFullscreenIntent();
      if (isEmbedded) {
        const target = new URL(url, window.location.href);
        window.parent.postMessage(
          { type: "nightslip-navigate-frame", url: `${target.pathname}${target.search}${target.hash}` },
          "*"
        );
        return;
      }
      window.location.href = url;
    }
    function refreshWrapperToFrame(url) {
      if (hasFullscreenMode() || wantsFullscreen()) rememberFullscreenIntent();
      if (isEmbedded) {
        const target = new URL(url, window.location.href);
        const frameUrl = `${target.pathname}${target.search}${target.hash}`;
        try {
          localStorage.setItem(PENDING_FRAME_URL_KEY, frameUrl);
          window.parent.postMessage({ type: "nightslip-refresh-wrapper" }, "*");
          window.setTimeout(() => {
            if (!document.hidden) navigateFrameTo(frameUrl);
          }, 700);
          return;
        } catch {}
      }
      navigateFrameTo(url);
    }
    window.addEventListener("pointerup", restoreFullscreenMode);
    window.addEventListener("keyup", restoreFullscreenMode);
    const reiSoundAt = 6900;
    const reiRevealAt = 7000;
    const chaseSceneAt = reiRevealAt + 3000;
    const manualContinueAt = Math.max(0, chaseSceneAt - 1500);
    const startedAt = performance.now();
    let advanced = false;

    fridgeCloseAudio.loop = true;
    let masterVoiceVolume = 1;
    try {
      const raw = localStorage.getItem("nightslip-voice-volume");
      if (raw !== null) masterVoiceVolume = Math.min(1, Math.max(0, Number(raw)));
    } catch {}
    fridgeCloseAudio.volume = 0.8 * masterVoiceVolume;
    bungAudio.volume = 0.9 * masterVoiceVolume;

    function startFridgeCloseAudio() {
      if (performance.now() - startedAt >= reiSoundAt) return;
      fridgeCloseAudio.play().catch(() => {});
    }

    function stopFridgeCloseAudio() {
      fridgeCloseAudio.pause();
      fridgeCloseAudio.currentTime = 0;
    }

    function advanceToChaseScene() {
      if (advanced) return;
      advanced = true;
      stopFridgeCloseAudio();
      continueButton.disabled = true;
      continueButton.classList.remove("visible");
      refreshWrapperToFrame(`/pages/noel-run/index.html?run=${Date.now()}`);
    }

    startFridgeCloseAudio();
    window.addEventListener("pointerdown", startFridgeCloseAudio, { once: true });
    window.addEventListener("keydown", startFridgeCloseAudio, { once: true });
    continueButton.addEventListener("click", advanceToChaseScene);
    window.addEventListener("pointerup", () => {
      if (performance.now() - startedAt >= manualContinueAt) advanceToChaseScene();
    });
    window.addEventListener("keyup", (event) => {
      if (performance.now() - startedAt >= manualContinueAt && (event.key === "Enter" || event.key === " ")) {
        advanceToChaseScene();
      }
    });

    setTimeout(() => {
      stopFridgeCloseAudio();
      bungAudio.currentTime = 0;
      bungAudio.play().catch(() => {});
    }, reiSoundAt);

    setTimeout(() => {
      rei.classList.add("visible");
    }, reiRevealAt);

    setTimeout(() => {
      continueButton.classList.add("visible");
    }, manualContinueAt);

    setTimeout(() => {
      advanceToChaseScene();
    }, chaseSceneAt);
  </script>
</body>
</html>
