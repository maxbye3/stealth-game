<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fridge</title>
  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    .stage {
      position: absolute;
      left: 8vw;
      top: 50%;
      width: min(58.5vw, 465px);
      height: min(69vh, 675px);
      transform: translateY(-50%);
    }

    .fridge {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
      image-rendering: pixelated;
    }

    .fridge-0 {
      z-index: 1;
    }

    .fridge-1 {
      z-index: 2;
      animation: fadeThird 6s linear forwards;
    }

    .fridge-2 {
      z-index: 3;
      animation: fadeSecond 4s linear forwards;
    }

    .fridge-3 {
      z-index: 4;
      animation: fadeFirst 2s linear forwards;
    }

    .rei {
      position: absolute;
      right: 9vw;
      bottom: 20vh;
      width: min(36vw, 390px);
      max-height: 88vh;
      object-fit: contain;
      image-rendering: pixelated;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 500ms linear, transform 500ms linear;
    }

    .rei.visible {
      opacity: 0.9;
      transform: translateY(0);
    }

    @keyframes fadeFirst {
      0%,
      50% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes fadeSecond {
      0%,
      75% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes fadeThird {
      0%,
      83.333% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Fridge opening sequence">
    <img class="fridge fridge-0" src="../../fridge/fridge-0-clean.png" alt="" />
    <img class="fridge fridge-1" src="../../fridge/fridge-1-clean.png" alt="" />
    <img class="fridge fridge-2" src="../../fridge/fridge-2-clean.png" alt="" />
    <img class="fridge fridge-3" src="../../fridge/fridge-3-clean.png" alt="" />
  </main>
  <img class="rei" src="../../fridge/rei.png" alt="" />
  <script>
    const fridgeCloseAudio = new Audio("../../fridge/sounds/fridge-close.mp3");
    const bungAudio = new Audio("../../fridge/sounds/bung.mp3");
    const rei = document.querySelector(".rei");
    const reiSoundAt = 6900;
    const reiRevealAt = 7000;
    const chaseSceneAt = reiRevealAt + 1000;
    const startedAt = performance.now();

    fridgeCloseAudio.loop = true;
    let masterVoiceVolume = 1;
    try {
      const raw = localStorage.getItem("nightslip-voice-volume");
      if (raw !== null) masterVoiceVolume = Math.min(1, Math.max(0, Number(raw)));
    } catch {}
    fridgeCloseAudio.volume = 0.8 * masterVoiceVolume;
    bungAudio.volume = 0.9 * masterVoiceVolume;

    function startFridgeCloseAudio() {
      if (performance.now() - startedAt >= reiSoundAt) return;
      fridgeCloseAudio.play().catch(() => {});
    }

    function stopFridgeCloseAudio() {
      fridgeCloseAudio.pause();
      fridgeCloseAudio.currentTime = 0;
    }

    startFridgeCloseAudio();
    window.addEventListener("pointerdown", startFridgeCloseAudio, { once: true });
    window.addEventListener("keydown", startFridgeCloseAudio, { once: true });

    setTimeout(() => {
      stopFridgeCloseAudio();
      bungAudio.currentTime = 0;
      bungAudio.play().catch(() => {});
    }, reiSoundAt);

    setTimeout(() => {
      rei.classList.add("visible");
    }, reiRevealAt);

    setTimeout(() => {
      window.location.href = "../noel-run/";
    }, chaseSceneAt);
  </script>
</body>
</html>
