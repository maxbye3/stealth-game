<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Noel Transform</title>
    <style>
      @font-face {
        font-family: "Press Start 2P";
        src: url("../../fonts/PressStart2P.ttf") format("truetype");
        font-display: swap;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #050607;
        color: #f4f4f4;
      }

      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
      }

      .stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #050607;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100svh;
        background: #050607;
      }

      .controls {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        z-index: 3;
        display: flex;
        align-items: start;
        justify-content: flex-start;
        padding:
          max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0
          max(16px, env(safe-area-inset-left));
        pointer-events: none;
        touch-action: none;
      }

      .controls[hidden] {
        display: none;
      }

      .stick {
        width: 132px;
        height: 132px;
        position: relative;
        border: 1px solid rgba(222, 237, 226, 0.2);
        border-radius: 50%;
        background: rgba(5, 10, 12, 0.44);
        pointer-events: auto;
        touch-action: none;
        user-select: none;
        box-shadow: inset 0 0 0 18px rgba(255, 255, 255, 0.03);
      }

      .knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        border: 1px solid rgba(238, 246, 239, 0.32);
        background: rgba(223, 249, 232, 0.82);
      }

      #plate-gif {
        position: absolute;
        pointer-events: none;
        image-rendering: pixelated;
      }

      @media (max-width: 720px) {
        .stick {
          width: 112px;
          height: 112px;
        }

        .knob {
          width: 46px;
          height: 46px;
        }
      }
    </style>
  </head>
  <body>
    <main class="stage">
      <canvas id="game" width="1280" height="720" aria-label="Noel transform scene"></canvas>
      <img id="plate-gif" src="../../assets/plate.gif" alt="Plate with food">
      <div class="controls" aria-label="Game controls" hidden>
        <div id="stick" class="stick" aria-label="Movement joystick">
          <div id="knob" class="knob"></div>
        </div>
      </div>
    </main>

    <script>
      const canvas = document.querySelector("#game");
      const ctx = canvas.getContext("2d");
      const controls = document.querySelector(".controls");
      const stick = document.querySelector("#stick");
      const knob = document.querySelector("#knob");
      const plateGif = document.querySelector("#plate-gif");
      const FULLSCREEN_INTENT_KEY = "nightslip-fullscreen-intent";
      const isEmbedded = window.parent && window.parent !== window;
      function rememberFullscreenIntent() { try { sessionStorage.setItem(FULLSCREEN_INTENT_KEY, "1"); } catch {} }
      function wantsFullscreen() { try { return sessionStorage.getItem(FULLSCREEN_INTENT_KEY) === "1"; } catch { return false; } }
      function hasFullscreenMode() { return Boolean(document.fullscreenElement || (isEmbedded && wantsFullscreen())); }
      function requestFullscreenMode() { if (isEmbedded) { window.parent.postMessage({ type: "nightslip-request-fullscreen" }, "*"); return Promise.resolve(); } if (document.fullscreenElement) return Promise.resolve(); return document.documentElement.requestFullscreen().catch(() => {}); }
      function restoreFullscreenMode() { if (wantsFullscreen() && !hasFullscreenMode()) requestFullscreenMode(); }
      function navigateTo(url) { if (hasFullscreenMode() || wantsFullscreen()) rememberFullscreenIntent(); window.location.href = url; }
      window.addEventListener("pointerup", restoreFullscreenMode);
      window.addEventListener("keyup", restoreFullscreenMode);

      const W = canvas.width;
      const H = canvas.height;
      const keys = new Set();
      const stickInput = { x: 0, y: 0 };
      let activeStickPointerId = null;
      const dialogueDuration = 3000;
      const dialogueButton = { x: 650, y: 445, w: 470, h: 72 };
      const yesButton = { x: 650, y: 415, w: 180, h: 72 };
      const noButton = { x: 860, y: 415, w: 180, h: 72 };
      const noelVoice = new Audio("../../sounds/voice.m4a");
      const oscarVoice = new Audio("../../oscar/sounds/oscar_voice.m4a");
      const noelTurn = new Audio("../../sounds/noel-turn.mp3");
      const footstepAudio = new Audio("../../sounds/footstep.m4a");
      noelVoice.preload = "auto";
      oscarVoice.preload = "auto";
      noelTurn.preload = "auto";
      footstepAudio.preload = "auto";
      footstepAudio.loop = true;
      let masterVoiceVolume = 1;
      try {
        const raw = localStorage.getItem("nightslip-voice-volume");
        if (raw !== null) masterVoiceVolume = Math.min(1, Math.max(0, Number(raw)));
      } catch {}
      noelVoice.volume = masterVoiceVolume;
      oscarVoice.volume = masterVoiceVolume;
      noelTurn.volume = masterVoiceVolume;
      footstepAudio.volume = 0.58 * masterVoiceVolume;

      const backgroundImage = new Image();
      const humanImage = new Image();
      const portraitImage = new Image();
      const prawnPortraitImage = new Image();
      const oscarPortraitImage = new Image();
      const oscarSpriteImage = new Image();
      const oscarIdleImage = new Image();
      let backgroundReady = false;
      let humanReady = false;
      let portraitReady = false;
      let prawnPortraitReady = false;
      let oscarPortraitReady = false;
      let oscarSpriteReady = false;
      let oscarIdleReady = false;

      backgroundImage.src = "../../assets/table.png";
      humanImage.src = "../../assets/noel-human-transparent.png";
      portraitImage.src = "../../assets/noel.png";
      prawnPortraitImage.src = "../../assets/noel-prawn.png";
      oscarPortraitImage.src = "../../oscar/oscar-portrait.png";
      oscarSpriteImage.src = "../../oscar/oscar-sprite-clean.png";
      oscarIdleImage.src = "../../oscar/oscar-idle-clean.png";
      backgroundImage.addEventListener("load", () => {
        backgroundReady = true;
      });
      humanImage.addEventListener("load", () => {
        humanReady = true;
      });
      portraitImage.addEventListener("load", () => {
        portraitReady = true;
      });
      prawnPortraitImage.addEventListener("load", () => {
        prawnPortraitReady = true;
      });
      oscarPortraitImage.addEventListener("load", () => {
        oscarPortraitReady = true;
      });
      oscarSpriteImage.addEventListener("load", () => {
        oscarSpriteReady = true;
      });
      oscarIdleImage.addEventListener("load", () => {
        oscarIdleReady = true;
      });

      const humanSheet = {
        frameCount: 5,
        cols: [[199, 302], [353, 456], [506, 609], [660, 763], [814, 917]],
        rows: [[58, 300], [350, 585], [644, 871], [930, 1164], [1232, 1470]],
        rowMap: { s: 1, se: 2, e: 2, ne: 2, n: 4, nw: 3, w: 3, sw: 3 },
        sideWalkRate: 0.85,
        widthRatio: 0.48,
        targetH: 70
      };

      const oscarSheet = {
        frameCount: 5,
        frameW: 128,
        frameH: 250,
        rowMap: { s: 0, se: 2, e: 2, ne: 2, n: 3, nw: 1, w: 1, sw: 1 },
        targetH: 94
      };
      const oscarIdleSheet = {
        frameCount: 8,
        frameW: 160,
        frameH: 390,
        targetH: 94
      };

      const player = {
        x: 1137,
        y: 468,
        r: 16,
        speed: 250,
        dir: "w",
        walk: 0,
        moving: false
      };

      const oscar = {
        x: 800,
        y: 468,
        targetX: 1030,
        targetY: 468,
        dir: "e",
        walk: 0,
        moving: false
      };

      const oscarLines = [
        { line: "Did you know I'm amazing at zen puzzle games?", speaker: "oscar", kind: "choice" },
      ];
      const oscarLinesYes = [
        { line: "I did", speaker: "noel" },
        { line: "Well I am", speaker: "oscar" },
        { line: "Anyway", speaker: "oscar" },
        { line: "I really recommend not eating anything in this room", speaker: "oscar" },
      ];
      const oscarLinesNo = [
        { line: "I did not", speaker: "noel" },
        { line: "Well I am", speaker: "oscar" },
        { line: "Anyway", speaker: "oscar" },
        { line: "I really recommend not eating anything in this room", speaker: "oscar" },
      ];
      const oscarRepeatLines = [
        { line: "I'm very fast at puzzles", speaker: "oscar" },
      ];
      let currentOscarLines = oscarLines;
      let oscarLineIndex = 0;
      let oscarIntroComplete = false;
      let oscarRepeatSeen = false;

      const tableBounds = { x: 390, y: 275, w: 350, h: 190 };
      const trigger = { x: 374, y: 259, w: 382, h: 222 };  // Expanded for bump detection
      const walkBounds = [
        { x: 72, y: 210, w: 1002, h: 434 },
        { x: 1045, y: 248, w: 178, h: 292 }
      ];
      const blockedRects = [tableBounds];

      let state = "start";
      let lastTime = performance.now();
      let dialogueStart = 0;
      let dialogueSeen = false;
      let audioPrimed = false;
      let dialogue = {
        line: "",
        portrait: "human",
        kind: "continue",
        next: null
      };

      // Position the plate GIF overlay on the canvas
      function updatePlateGifPosition() {
        const canvasBounds = canvas.getBoundingClientRect();
        const scaleX = canvasBounds.width / W;
        const scaleY = canvasBounds.height / H;
        const gifSize = 100;
        const plateX = tableBounds.x + tableBounds.w / 2 - gifSize / 2 + 10;
        const plateY = tableBounds.y + tableBounds.h / 2 - gifSize / 2 - 10;
        
        plateGif.style.left = (canvasBounds.left + plateX * scaleX) + "px";
        plateGif.style.top = (canvasBounds.top + plateY * scaleY) + "px";
        plateGif.style.width = (gifSize * scaleX) + "px";
        plateGif.style.height = (gifSize * scaleY) + "px";
        plateGif.style.display = state === "play" ? "block" : "none";
      }

      plateGif.addEventListener("load", updatePlateGifPosition);
      window.addEventListener("resize", updatePlateGifPosition);

      function rectContains(rect, x, y) {
        return x >= rect.x && x <= rect.x + rect.w && y >= rect.y && y <= rect.y + rect.h;
      }

      function isBlocked(x, y, r) {
        const points = [
          { x, y },
          { x: x - r, y },
          { x: x + r, y },
          { x, y: y - r },
          { x, y: y + r }
        ];
        return (
          points.some((point) => !walkBounds.some((rect) => rectContains(rect, point.x, point.y))) ||
          points.some((point) => blockedRects.some((rect) => rectContains(rect, point.x, point.y)))
        );
      }

      function circleRectsCollide(x, y, r, rect) {
        const closestX = Math.max(rect.x, Math.min(x, rect.x + rect.w));
        const closestY = Math.max(rect.y, Math.min(y, rect.y + rect.h));
        const distX = x - closestX;
        const distY = y - closestY;
        const dist = Math.sqrt(distX * distX + distY * distY);
        return dist < r;
      }

      function directionFromVector(x, y, fallback = "s") {
        if (!x && !y) return fallback;
        const angle = Math.atan2(y, x);
        const sector = Math.round(angle / (Math.PI / 4));
        return ["e", "se", "s", "sw", "w", "nw", "n", "ne"][((sector % 8) + 8) % 8];
      }

      function updateOscar(dt) {
        const dx = oscar.targetX - oscar.x;
        const dy = oscar.targetY - oscar.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 4) {
          oscar.moving = false;
          oscar.x = oscar.targetX;
          oscar.y = oscar.targetY;
          startOscarDialogue();
          return;
        }
        const speed = 220;
        oscar.x += (dx / dist) * speed * dt;
        oscar.y += (dy / dist) * speed * dt;
        oscar.dir = directionFromVector(dx, dy, oscar.dir);
        oscar.walk += dt * 12;
        oscar.moving = true;
      }

      function primeAudio() {
        if (audioPrimed) return;
        audioPrimed = true;
        [noelVoice, oscarVoice, noelTurn].forEach((clip) => {
          clip.load();
          const previousMuted = clip.muted;
          clip.muted = true;
          clip.play()
            .then(() => {
              clip.pause();
              clip.currentTime = 0;
              clip.muted = previousMuted;
            })
            .catch(() => {
              clip.muted = previousMuted;
            });
        });
      }

      function startIntro() {
        if (state !== "start") return;
        primeAudio();
        state = "oscar-walk";
        lastTime = performance.now();
      }

      function showOscarLine() {
        const entry = currentOscarLines[oscarLineIndex];
        const duration = Math.max(600, entry.line.length * 52);
        dialogue = {
          line: entry.line,
          portrait: entry.speaker === "oscar" ? "oscar" : "human",
          kind: entry.kind || "continue",
          next: null,
          duration
        };
        dialogueStart = performance.now();
        if (entry.speaker === "noel") {
          oscarVoice.pause();
          oscarVoice.currentTime = 0;
          noelVoice.currentTime = 0;
          noelVoice.play().catch(() => {});
        } else {
          noelVoice.pause();
          noelVoice.currentTime = 0;
          oscarVoice.currentTime = 0;
          oscarVoice.play().catch(() => {});
        }
      }

      function chooseOscarDialogue(answer) {
        currentOscarLines = answer === "yes" ? oscarLinesYes : oscarLinesNo;
        oscarLineIndex = 0;
        showOscarLine();
      }

      function startOscarDialogue() {
        oscarLineIndex = 0;
        state = "oscar-dialogue";
        showOscarLine();
      }

      function continueOscarDialogue() {
        oscarLineIndex++;
        if (oscarLineIndex >= currentOscarLines.length) {
          oscarVoice.pause();
          oscarVoice.currentTime = 0;
          oscar.moving = false;
          if (currentOscarLines !== oscarRepeatLines) oscarIntroComplete = true;
          state = "play";
          return;
        }
        showOscarLine();
      }

      function startOscarRepeatDialogue() {
        stopFootsteps();
        oscarRepeatSeen = true;
        currentOscarLines = oscarRepeatLines;
        oscarLineIndex = 0;
        state = "oscar-dialogue";
        showOscarLine();
      }

      function startDialogue() {
        stopFootsteps();
        dialogueSeen = true;
        state = "dialogue";
        dialogue = {
          line: "This looks delicious. Should I eat it?",
          portrait: "human",
          kind: "choice",
          next: null
        };
        dialogueStart = performance.now();
        noelVoice.currentTime = 0;
        noelVoice.play().catch(() => {});
      }

      function setDialogue(nextDialogue) {
        noelVoice.pause();
        noelVoice.currentTime = 0;
        dialogue = nextDialogue;
        dialogueStart = performance.now();
        noelVoice.play().catch(() => {});
      }

      function chooseDialogue(answer) {
        setDialogue({
          line: answer === "yes" ? "Yum yum yum" : "I'm eating it anyway",
          portrait: "human",
          kind: "continue",
          next: "prawn"
        });
      }

      function continueDialogue() {
        if (dialogue.next === "prawn") {
          noelTurn.currentTime = 0;
          noelTurn.play().catch(() => {});
          setDialogue({
            line: "Oh no I've turned into a prawn. I must go to bed.",
            portrait: "prawn",
            kind: "continue",
            next: "level1"
          });
          return;
        }

        noelVoice.pause();
        noelVoice.currentTime = 0;
        if (dialogue.next === "level1") {
          setTimeout(() => { navigateTo("../../index.html?start=level1"); }, 2000);
        } else {
          state = "play";
        }
      }

      function updatePlayer(dt) {
        let dx = 0;
        let dy = 0;

        if (keys.has("arrowleft") || keys.has("a")) dx -= 1;
        if (keys.has("arrowright") || keys.has("d")) dx += 1;
        if (keys.has("arrowup") || keys.has("w")) dy -= 1;
        if (keys.has("arrowdown") || keys.has("s")) dy += 1;

        dx += stickInput.x;
        dy += stickInput.y;

        const mag = Math.hypot(dx, dy);
        player.moving = false;
        if (mag > 0) {
          const nx = dx / mag;
          const ny = dy / mag;
          const nextX = player.x + nx * player.speed * dt;
          const nextY = player.y + ny * player.speed * dt;
          const beforeX = player.x;
          const beforeY = player.y;
          player.dir = directionFromVector(nx, ny, player.dir);
          player.walk += dt * 12;
          
          // Trigger Oscar repeat dialogue on proximity
          if (oscarIntroComplete && !oscarRepeatSeen && Math.hypot(player.x - oscar.x, player.y - oscar.y) < 80) {
            startOscarRepeatDialogue();
            return;
          }

          // Trigger dialogue on table collision
          if (!dialogueSeen && circleRectsCollide(nextX, nextY, player.r, tableBounds)) {
            startDialogue();
            return;
          }
          
          if (!isBlocked(nextX, player.y, player.r)) player.x = nextX;
          if (!isBlocked(player.x, nextY, player.r)) player.y = nextY;
          player.moving = Math.hypot(player.x - beforeX, player.y - beforeY) > 0.2;
        }
        syncFootsteps();
      }

      function syncFootsteps() {
        if (state === "play" && player.moving) {
          if (footstepAudio.paused) footstepAudio.play().catch(() => {});
          return;
        }
        stopFootsteps();
      }

      function stopFootsteps() {
        if (footstepAudio.paused) return;
        footstepAudio.pause();
        footstepAudio.currentTime = 0;
      }

      function drawOscarPortrait(px, py, size) {
        const s = size / 100;
        const cx = px + size / 2;
        const cy = py + size / 2;
        ctx.fillStyle = "#12151f";
        ctx.fillRect(px, py, size, size);
        // hair
        ctx.fillStyle = "#3b2010";
        ctx.fillRect(cx - 18*s, cy - 42*s, 36*s, 18*s);
        // face
        ctx.fillStyle = "#c07a50";
        ctx.fillRect(cx - 14*s, cy - 28*s, 28*s, 26*s);
        // eyes
        ctx.fillStyle = "#111";
        ctx.fillRect(cx - 9*s, cy - 20*s, 5*s, 5*s);
        ctx.fillRect(cx + 4*s, cy - 20*s, 5*s, 5*s);
        // smile
        ctx.fillStyle = "#7a3e1e";
        ctx.fillRect(cx - 6*s, cy - 8*s, 12*s, 3*s);
        // shirt (teal)
        ctx.fillStyle = "#1e7d8c";
        ctx.fillRect(cx - 22*s, cy - 2*s, 44*s, 34*s);
        // collar
        ctx.fillStyle = "#f0f0e8";
        ctx.fillRect(cx - 6*s, cy - 2*s, 12*s, 10*s);
        // name
        ctx.fillStyle = "rgba(244,244,244,0.7)";
        ctx.font = `${Math.round(13*s)}px 'Press Start 2P', monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "bottom";
        ctx.fillText("OSCAR", cx, py + size - 12*s);
        ctx.textAlign = "start";
        ctx.textBaseline = "top";
      }

      function drawOscar() {
        const x = Math.round(oscar.x);
        const y = Math.round(oscar.y);
        const bob = Math.sin(oscar.walk) * 1.5;
        // shadow
        ctx.fillStyle = "rgba(0,0,0,0.34)";
        ctx.fillRect(x - 21, y + 18, 42, 8);
        if (!oscar.moving && oscarIdleReady) {
          const frame = Math.floor(performance.now() / 720) % oscarIdleSheet.frameCount;
          const targetH = oscarIdleSheet.targetH;
          const targetW = targetH * (oscarIdleSheet.frameW / oscarIdleSheet.frameH);
          ctx.save();
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(
            oscarIdleImage,
            frame * oscarIdleSheet.frameW,
            0,
            oscarIdleSheet.frameW,
            oscarIdleSheet.frameH,
            x - targetW / 2,
            y + 28 - targetH,
            targetW,
            targetH
          );
          ctx.restore();
          return;
        }
        if (oscarSpriteReady) {
          const row = oscarSheet.rowMap[oscar.dir || "s"] ?? oscarSheet.rowMap.s;
          const frame = oscar.moving ? Math.floor(oscar.walk * 0.55) % oscarSheet.frameCount : 0;
          const targetH = oscarSheet.targetH;
          const targetW = targetH * (oscarSheet.frameW / oscarSheet.frameH);
          ctx.save();
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(
            oscarSpriteImage,
            frame * oscarSheet.frameW,
            row * oscarSheet.frameH,
            oscarSheet.frameW,
            oscarSheet.frameH,
            x - targetW / 2,
            y + 28 - targetH + bob,
            targetW,
            targetH
          );
          ctx.restore();
          return;
        }
        // legs
        ctx.fillStyle = "#2a4a7a";
        ctx.fillRect(x - 9, y + 6 + bob, 8, 18);
        ctx.fillRect(x + 1, y + 6 - bob, 8, 18);
        // shoes
        ctx.fillStyle = "#111";
        ctx.fillRect(x - 10, y + 22 + bob, 10, 6);
        ctx.fillRect(x + 1, y + 22 - bob, 10, 6);
        // shirt (teal)
        ctx.fillStyle = "#1e7d8c";
        ctx.fillRect(x - 11, y - 6 + bob, 22, 16);
        // collar
        ctx.fillStyle = "#f0f0e8";
        ctx.fillRect(x - 4, y - 6 + bob, 8, 7);
        // face
        ctx.fillStyle = "#c07a50";
        ctx.fillRect(x - 9, y - 22 + bob, 18, 18);
        // hair
        ctx.fillStyle = "#3b2010";
        ctx.fillRect(x - 11, y - 30 + bob, 22, 12);
        // eyes
        ctx.fillStyle = "#111";
        ctx.fillRect(x - 5, y - 17 + bob, 3, 3);
        ctx.fillRect(x + 2, y - 17 + bob, 3, 3);
      }

      function drawBackground() {
        ctx.fillStyle = "#050607";
        ctx.fillRect(0, 0, W, H);
        if (!backgroundReady) return;
        ctx.drawImage(backgroundImage, 0, 0, W, H);
      }

      function drawPlayer() {
        ctx.save();
        ctx.imageSmoothingEnabled = false;
        ctx.fillStyle = "rgba(0, 0, 0, 0.34)";
        ctx.fillRect(player.x - 17, player.y + 18, 34, 7);

        if (!humanReady) {
          ctx.fillStyle = "#f5a14f";
          ctx.fillRect(player.x - 10, player.y - 30, 20, 52);
          ctx.restore();
          return;
        }

        const direction = player.dir || "s";
        const row = humanSheet.rowMap[direction] ?? humanSheet.rowMap.s;
        const sideFacing = ["e", "ne", "se", "w", "nw", "sw"].includes(direction);
        const frameStep = Math.floor(player.walk * (sideFacing ? humanSheet.sideWalkRate : 1));
        const frame = player.moving ? frameStep % humanSheet.frameCount : Math.floor(player.walk * 0.35) % humanSheet.frameCount;
        const [sourceX, sourceRight] = humanSheet.cols[frame];
        const [sourceY, sourceBottom] = humanSheet.rows[row];
        const sourceW = sourceRight - sourceX;
        const sourceH = sourceBottom - sourceY;
        const targetH = humanSheet.targetH;
        const targetW = targetH * humanSheet.widthRatio;
        const dx = player.x - targetW / 2;
        const dy = player.y + 23 - targetH;

        ctx.drawImage(humanImage, sourceX, sourceY, sourceW, sourceH, dx, dy, targetW, targetH);
        ctx.restore();
      }

      function drawDialogue() {
        const dur = dialogue.duration || dialogueDuration;
        const elapsed = Math.min(dur, performance.now() - dialogueStart);
        const progress = elapsed / dur;
        const chars = Math.min(dialogue.line.length, Math.ceil(progress * dialogue.line.length));
        const text = dialogue.line.slice(0, chars);
        const complete = elapsed >= dur;

        ctx.fillStyle = "#000";
        ctx.fillRect(0, 0, W, H);

        const portraitSize = 430;
        const portraitX = 150;
        const portraitY = (H - portraitSize) / 2;
        if (dialogue.portrait === "oscar") {
          if (oscarPortraitReady) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(portraitX, portraitY, portraitSize, portraitSize);
            ctx.clip();
            ctx.drawImage(oscarPortraitImage, portraitX, portraitY, portraitSize, portraitSize);
            ctx.restore();
          } else {
            drawOscarPortrait(portraitX, portraitY, portraitSize);
          }
        } else {
          const currentPortrait = dialogue.portrait === "prawn" ? prawnPortraitImage : portraitImage;
          const currentPortraitReady = dialogue.portrait === "prawn" ? prawnPortraitReady : portraitReady;
          if (currentPortraitReady) {
            ctx.save();
            ctx.beginPath();
            ctx.rect(portraitX, portraitY, portraitSize, portraitSize);
            ctx.clip();
            ctx.drawImage(currentPortrait, portraitX, portraitY, portraitSize, portraitSize);
            ctx.restore();
          }
        }

        ctx.fillStyle = "#f4f4f4";
        ctx.font = "24px 'Press Start 2P', monospace";
        ctx.textBaseline = "top";
        const textX = 650;
        const textY = 285;
        const maxWidth = 520;
        const words = text.split(" ");
        let line = "";
        let y = textY;
        words.forEach((word, index) => {
          const candidate = line ? `${line} ${word}` : word;
          if (ctx.measureText(candidate).width > maxWidth && line) {
            ctx.fillText(line, textX, y);
            y += 42;
            line = word;
          } else {
            line = candidate;
          }
          if (index === words.length - 1 && line) ctx.fillText(line, textX, y);
        });

        if (!complete && Math.floor(elapsed / 180) % 2 === 0) {
          ctx.fillRect(textX + Math.min(maxWidth, ctx.measureText(line).width + 12), y + 2, 5, 24);
        }

        if (complete) {
          if (dialogue.kind === "choice") {
            drawButton(yesButton, "YES");
            drawButton(noButton, "NO");
          } else {
            const pulse = Math.floor(performance.now() / 420) % 2 === 0;
            ctx.fillStyle = pulse ? "rgba(244, 244, 244, 0.16)" : "rgba(244, 244, 244, 0.09)";
            drawButton(dialogueButton, "PRESS TO CONTINUE", false);
          }
        }
      }

      function drawButton(rect, label, filled = true) {
        if (filled) {
          ctx.fillStyle = "rgba(244, 244, 244, 0.12)";
          ctx.fillRect(rect.x, rect.y, rect.w, rect.h);
        }
        ctx.strokeStyle = "#f4f4f4";
        ctx.lineWidth = 4;
        ctx.strokeRect(rect.x, rect.y, rect.w, rect.h);
        ctx.fillStyle = "#f4f4f4";
        ctx.font = rect.w > 220 ? "20px 'Press Start 2P', monospace" : "18px 'Press Start 2P', monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(label, rect.x + rect.w / 2, rect.y + rect.h / 2 + 1);
        ctx.textAlign = "start";
      }

      function update(dt) {
        if (state === "oscar-walk") { updateOscar(dt); return; }
        if (state === "oscar-dialogue") { stopFootsteps(); return; }
        if (state === "play") updatePlayer(dt);
        else stopFootsteps();
      }

      function draw() {
        if (state === "dialogue" || state === "oscar-dialogue") {
          drawDialogue();
          return;
        }
        drawBackground();
        if (state === "oscar-walk" || oscarIntroComplete) drawOscar();
        drawPlayer();
        if (state === "start") {
          ctx.fillStyle = "rgba(0, 0, 0, 0.62)";
          ctx.fillRect(0, 0, W, H);
          ctx.fillStyle = "#f4f4f4";
          ctx.font = "24px 'Press Start 2P', monospace";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("TAP TO START", W / 2, H / 2);
          ctx.textAlign = "start";
          ctx.textBaseline = "top";
        }
      }

      function frame(now) {
        const dt = Math.min(0.033, (now - lastTime) / 1000 || 0);
        lastTime = now;
        const controlsActive = state === "play";
        controls.hidden = !controlsActive;
        stick.style.pointerEvents = controlsActive ? "auto" : "none";
        update(dt);
        draw();
        updatePlateGifPosition();
        requestAnimationFrame(frame);
      }

      function setStickFromPoint(clientX, clientY) {
        const rect = stick.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const max = rect.width * 0.34;
        const dx = clientX - cx;
        const dy = clientY - cy;
        const mag = Math.hypot(dx, dy);
        const clamped = Math.min(max, mag);
        const nx = mag ? dx / mag : 0;
        const ny = mag ? dy / mag : 0;
        stickInput.x = (nx * clamped) / max;
        stickInput.y = (ny * clamped) / max;
        knob.style.transform = `translate(calc(-50% + ${nx * clamped}px), calc(-50% + ${ny * clamped}px))`;
      }

      function resetStick() {
        stickInput.x = 0;
        stickInput.y = 0;
        activeStickPointerId = null;
        knob.style.transform = "translate(-50%, -50%)";
      }

      stick.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        activeStickPointerId = event.pointerId;
        try { stick.setPointerCapture(event.pointerId); } catch {}
        setStickFromPoint(event.clientX, event.clientY);
      });
      window.addEventListener("pointermove", (event) => {
        if (event.pointerId !== activeStickPointerId) return;
        event.preventDefault();
        setStickFromPoint(event.clientX, event.clientY);
      });
      window.addEventListener("pointerup", (event) => {
        if (event.pointerId === activeStickPointerId) resetStick();
      });
      window.addEventListener("pointercancel", (event) => {
        if (event.pointerId === activeStickPointerId) resetStick();
      });

      window.addEventListener("keydown", (event) => {
        if (state === "start") {
          event.preventDefault();
          startIntro();
          return;
        }
        if (state === "oscar-dialogue") {
          const elapsed = performance.now() - dialogueStart;
          if (dialogue.kind === "choice") {
            if (event.key === "y") { event.preventDefault(); chooseOscarDialogue("yes"); }
            if (event.key === "n") { event.preventDefault(); chooseOscarDialogue("no"); }
          } else if ((event.key === "Enter" || event.key === " ") && elapsed >= (dialogue.duration || dialogueDuration)) {
            event.preventDefault();
            continueOscarDialogue();
          }
          return;
        }
        if (state === "dialogue" && (event.key === "Enter" || event.key === " ")) {
          event.preventDefault();
          if (dialogue.kind === "choice") {
            chooseDialogue("yes");
          } else {
            continueDialogue();
          }
          return;
        }
        if (state === "dialogue" && event.key.toLowerCase() === "n" && dialogue.kind === "choice") {
          event.preventDefault();
          chooseDialogue("no");
          return;
        }
        keys.add(event.key.toLowerCase());
      });
      window.addEventListener("keyup", (event) => {
        keys.delete(event.key.toLowerCase());
      });
      function canvasPoint(event) {
        const source = event.changedTouches?.[0] || event;
        const bounds = canvas.getBoundingClientRect();
        return {
          x: ((source.clientX - bounds.left) / bounds.width) * W,
          y: ((source.clientY - bounds.top) / bounds.height) * H
        };
      }

      function rectContainsPadded(rect, x, y, padding = 50) {
        return x >= rect.x - padding && x <= rect.x + rect.w + padding && y >= rect.y - padding && y <= rect.y + rect.h + padding;
      }

      let lastPressHandledAt = 0;
      function isControlEvent(event) {
        return controls.contains(event.target);
      }

      function handleScenePress(event) {
        if (isControlEvent(event)) return false;
        const now = performance.now();
        if (now - lastPressHandledAt < 260) return false;
        const { x, y } = canvasPoint(event);
        const elapsed = performance.now() - dialogueStart;
        if (state === "start") {
          startIntro();
          lastPressHandledAt = now;
          return true;
        }
        if (state === "oscar-dialogue") {
          if (dialogue.kind === "choice") {
            if (rectContainsPadded(yesButton, x, y)) {
              chooseOscarDialogue("yes");
              lastPressHandledAt = now;
              return true;
            }
            if (rectContainsPadded(noButton, x, y)) {
              chooseOscarDialogue("no");
              lastPressHandledAt = now;
              return true;
            }
          } else if (elapsed >= (dialogue.duration || dialogueDuration)) {
            continueOscarDialogue();
            lastPressHandledAt = now;
            return true;
          }
          return false;
        }
        if (state !== "dialogue") return false;
        if (elapsed < dialogueDuration) return false;
        if (dialogue.kind === "choice") {
          if (rectContainsPadded(yesButton, x, y)) {
            chooseDialogue("yes");
            lastPressHandledAt = now;
            return true;
          }
          if (rectContainsPadded(noButton, x, y)) {
            chooseDialogue("no");
            lastPressHandledAt = now;
            return true;
          }
        } else {
          continueDialogue();
          lastPressHandledAt = now;
          return true;
        }
        return false;
      }

      function bindPressHandler(target, handler) {
        ["pointerdown", "touchend", "click"].forEach((type) => {
          target.addEventListener(type, (event) => {
            if (handler(event)) {
              event.preventDefault();
              event.stopPropagation();
            }
          }, { capture: true });
        });
      }

      bindPressHandler(document, handleScenePress);
      canvas.addEventListener("pointerdown", (event) => {
        if (handleScenePress(event)) event.preventDefault();
      });

      document.fonts?.load("24px 'Press Start 2P'").catch(() => {});
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
