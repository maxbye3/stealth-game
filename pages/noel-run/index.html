<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Noel Run</title>
    <style>
      @font-face {
        font-family: "Press Start 2P";
        src: url("../../fonts/PressStart2P.ttf") format("truetype");
        font-display: swap;
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none;
        touch-action: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #06090b;
        color: #f4fbff;
      }

      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
      }

      .runner {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #06090b;
        overflow: hidden;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100svh;
        background: #06090b;
      }

      .timer {
        position: fixed;
        top: max(16px, env(safe-area-inset-top));
        left: 50%;
        z-index: 2;
        min-width: 128px;
        padding: 12px 16px;
        border: 2px solid rgba(255, 255, 255, 0.72);
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.56);
        box-shadow: 0 12px 34px rgba(0, 0, 0, 0.35);
        font: 18px "Press Start 2P", monospace;
        text-align: center;
        transform: translateX(-50%);
      }

      .controls {
        position: fixed;
        left: 0;
        right: 0;
        top: 0;
        z-index: 3;
        display: flex;
        align-items: start;
        justify-content: flex-start;
        padding:
          max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0
          max(16px, env(safe-area-inset-left));
        pointer-events: none;
        touch-action: none;
      }

      .controls[hidden] {
        display: none;
      }

      .stick {
        width: 132px;
        height: 132px;
        position: relative;
        border: 1px solid rgba(222, 237, 226, 0.2);
        border-radius: 50%;
        background: rgba(5, 10, 12, 0.44);
        pointer-events: auto;
        touch-action: none;
        user-select: none;
        box-shadow: inset 0 0 0 18px rgba(255, 255, 255, 0.03);
      }

      .knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 52px;
        height: 52px;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        border: 1px solid rgba(238, 246, 239, 0.32);
        background: rgba(223, 249, 232, 0.82);
      }

      .objective-label {
        position: fixed;
        top: max(74px, calc(env(safe-area-inset-top) + 74px));
        left: 50%;
        z-index: 2;
        color: #f4fbff;
        font: 14px "Press Start 2P", monospace;
        line-height: 1.2;
        text-align: center;
        text-shadow: 0 3px 10px rgba(0, 0, 0, 0.85);
        transform: translateX(-50%);
        white-space: nowrap;
      }

      @media (max-width: 720px) {
        .stick {
          width: 112px;
          height: 112px;
        }

        .knob {
          width: 46px;
          height: 46px;
        }
      }
    </style>
  </head>
  <body>
    <main class="runner">
      <canvas id="runnerCanvas" width="1280" height="720" aria-label="Noel running down an infinite corridor"></canvas>
      <div id="timer" class="timer">60</div>
      <div class="objective-label">Objective: run</div>
      <div class="controls" aria-label="Runner controls" hidden>
        <div id="stick" class="stick" aria-label="Movement joystick">
          <div id="knob" class="knob"></div>
        </div>
      </div>
    </main>

    <script>
      const canvas = document.querySelector("#runnerCanvas");
      const ctx = canvas.getContext("2d");
      const timerEl = document.querySelector("#timer");
      const controls = document.querySelector(".controls");
      const stick = document.querySelector("#stick");
      const knob = document.querySelector("#knob");
      const PROGRESS_KEY = "nightslip-progress";
      const FULLSCREEN_INTENT_KEY = "nightslip-fullscreen-intent";
      const isEmbedded = window.parent && window.parent !== window;
      function saveProgress(index) { try { localStorage.setItem(PROGRESS_KEY, String(index)); } catch {} }
      function rememberFullscreenIntent() { try { sessionStorage.setItem(FULLSCREEN_INTENT_KEY, "1"); } catch {} }
      function wantsFullscreen() { try { return sessionStorage.getItem(FULLSCREEN_INTENT_KEY) === "1"; } catch { return false; } }
      // Wrapper reports its fullscreen state via postMessage; null = old wrapper.
      let parentFullscreen = null;
      window.addEventListener("message", (event) => { if (!isEmbedded || event.source !== window.parent) return; if (event.data?.type === "nightslip-fullscreen-state") parentFullscreen = Boolean(event.data.fullscreen); });
      function hasFullscreenMode() { if (document.fullscreenElement) return true; if (!isEmbedded) return false; return parentFullscreen !== null ? parentFullscreen : wantsFullscreen(); }
      function requestFullscreenMode() { if (isEmbedded) { window.parent.postMessage({ type: "nightslip-request-fullscreen" }, "*"); return Promise.resolve(); } if (document.fullscreenElement) return Promise.resolve(); return document.documentElement.requestFullscreen().catch(() => {}); }
      function restoreFullscreenMode() { if (wantsFullscreen() && !hasFullscreenMode()) requestFullscreenMode(); }
      function navigateTo(url) { if (hasFullscreenMode() || wantsFullscreen()) rememberFullscreenIntent(); window.location.href = url; }
      function reloadWrapperForLevelStart(index) {
        saveProgress(index);
        rememberFullscreenIntent();
        if (isEmbedded) {
          window.parent.postMessage({ type: "nightslip-refresh-wrapper" }, "*");
          return;
        }
        window.location.href = `../../game.html?start=level${index}`;
      }
      window.addEventListener("pointerup", restoreFullscreenMode);
      window.addEventListener("keyup", restoreFullscreenMode);

      const W = canvas.width;
      const H = canvas.height;
      const params = new URLSearchParams(window.location.search);
      const hasCustomSeconds = params.has("seconds");
      const requestedSeconds = Number(params.get("seconds"));
      const duration = hasCustomSeconds && Number.isFinite(requestedSeconds)
        ? Math.min(60, Math.max(1, Math.floor(requestedSeconds)))
        : 60;
      const backgroundSpeed = 520;
      const obstacleSpeed = backgroundSpeed;
      const bgImage = new Image();
      const noelImage = new Image();
      const bookcaseImage = new Image();
      const niallImage = new Image();
      const reiImages = [new Image(), new Image()];
      let bgReady = false;
      let noelReady = false;
      let bookcaseReady = false;
      let niallReady = false;
      const reiReady = [false, false];
      let startTime = performance.now();
      let lastFrameTime = startTime;
      let lastTimer = duration;
      let gameState = "running";
      const keys = new Set();
      let activeStickPointerId = null;
      const player = {
        x: W + 100,
        y: H * 0.63,
        r: 26,
        speed: 355
      };
      const stickInput = { x: 0, y: 0 };
      const playBounds = {
        left: 82,
        right: W + 140,
        top: 110,
        bottom: H - 92
      };
      const obstacles = [];
      const niallWaveSpeed = 610;
      const niallWaveDuration = 3.8;
      const niallWaves = [];

      bgImage.src = "../../assets/infinite_run.png";
      noelImage.src = "../../assets/prawn-protagonist-sheet.png";
      bookcaseImage.src = "../../assets/bookcase.png";
      niallImage.src = "../../niall/niall-sprite.png";
      reiImages[0].src = "../../assets/rei1.png";
      reiImages[1].src = "../../assets/rei2.png";
      bgImage.addEventListener("load", () => {
        bgReady = true;
      });
      noelImage.addEventListener("load", () => {
        noelReady = true;
      });
      bookcaseImage.addEventListener("load", () => {
        bookcaseReady = true;
      });
      niallImage.addEventListener("load", () => {
        niallReady = true;
      });
      reiImages.forEach((image, index) => {
        image.addEventListener("load", () => {
          reiReady[index] = true;
        });
      });

      function seededNoise(index) {
        const value = Math.sin(index * 9283.37 + 17.11) * 43758.5453;
        return value - Math.floor(value);
      }

      function buildObstacles() {
        const lanes = [185, 295, 405, 515, 610];
        const waveSpacing = 0.875;
        const count = Math.ceil((duration + 4) / waveSpacing);

        for (let i = 0; i < count; i += 1) {
          const x = W + 430 + i * waveSpacing * obstacleSpeed;
          const jitter = (seededNoise(i + 73) - 0.5) * 44;
          const laneA = i % lanes.length;
          const laneB = (laneA + 2 + (i % 2)) % lanes.length;
          const width = 42 + Math.floor(seededNoise(i + 31) * 18);
          const height = 104 + Math.floor(seededNoise(i + 47) * 42);

          [laneA, laneB].forEach((laneIndex, blockIndex) => {
            obstacles.push({
              startX: x + jitter + blockIndex * 42,
              y: lanes[laneIndex],
              w: width,
              h: height
            });
          });
        }
      }

      function createNiallWave(countdownMark, lanes, seedOffset, speed = niallWaveSpeed, durationSeconds = niallWaveDuration) {
        const nialls = [];
        for (let i = 0; i < 15; i += 1) {
          nialls.push({
            startScreenX: -130 - (i % 3) * 48,
            y: lanes[i % lanes.length] + (seededNoise(i + seedOffset) - 0.5) * 10,
            scale: 0.86 + seededNoise(i + seedOffset + 97) * 0.18,
            phase: i * 0.22
          });
        }
        niallWaves.push({
          start: Math.max(0, duration - countdownMark),
          speed,
          duration: durationSeconds,
          nialls
        });
      }

      function buildNiallWaves() {
        createNiallWave(25, [145, 185, 225, 345, 385, 425, 545, 585, 625], 411);
        createNiallWave(15, [145, 185, 225, 265, 420, 460, 500, 540, 580, 620], 733);
        niallWaves.push({
          start: Math.max(0, duration - 5),
          speed: 1180,
          duration: 1.6,
          nialls: [{
            startScreenX: -150,
            y: H * 0.58,
            scale: 1.08,
            phase: 0
          }]
        });
      }

      function drawFallbackNoel(elapsed) {
        const x = W * 0.5;
        const y = H * 0.64;
        const bob = Math.sin(elapsed * 16) * 4;
        ctx.fillStyle = "rgba(0, 0, 0, 0.36)";
        ctx.fillRect(x - 40, y + 64, 80, 12);
        ctx.fillStyle = "#ff7437";
        ctx.fillRect(x - 24, y - 38 + bob, 48, 70);
        ctx.fillStyle = "#ffd79f";
        ctx.fillRect(x - 14, y - 22 + bob, 28, 22);
        ctx.fillStyle = "#1a1620";
        ctx.fillRect(x - 18, y + 30 - bob, 14, 44);
        ctx.fillRect(x + 4, y + 30 + bob, 14, 44);
      }

      function drawBackground(elapsed) {
        ctx.fillStyle = "#05080a";
        ctx.fillRect(0, 0, W, H);
        if (!bgReady) return;

        const scale = H / bgImage.height;
        const tileW = bgImage.width * scale;
        const tileH = H;
        const offset = (elapsed * backgroundSpeed) % tileW;
        const startX = -offset;

        ctx.save();
        ctx.translate(W, 0);
        ctx.scale(-1, 1);
        for (let x = startX - tileW; x < W + tileW; x += tileW) {
          ctx.drawImage(bgImage, x, 0, tileW, tileH);
        }
        ctx.restore();

        const vignette = ctx.createLinearGradient(0, 0, 0, H);
        vignette.addColorStop(0, "rgba(0, 0, 0, 0.25)");
        vignette.addColorStop(0.48, "rgba(0, 0, 0, 0)");
        vignette.addColorStop(1, "rgba(0, 0, 0, 0.34)");
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, W, H);
      }

      function drawObstacle(obstacle, elapsed) {
        const x = W - (obstacle.startX - elapsed * obstacleSpeed);
        const y = obstacle.y;
        const w = obstacle.w;
        const h = obstacle.h;

        ctx.save();
        ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
        ctx.fillRect(x - w / 2 + 8, y - h / 2 + 10, w, h);
        if (bookcaseReady) {
          ctx.imageSmoothingEnabled = true;
          ctx.drawImage(bookcaseImage, x - w / 2, y - h / 2, w, h);
        } else {
          ctx.fillStyle = "#7a4a23";
          ctx.fillRect(x - w / 2, y - h / 2, w, h);
          ctx.strokeStyle = "#d6a568";
          ctx.lineWidth = 4;
          ctx.strokeRect(x - w / 2 + 2, y - h / 2 + 2, w - 4, h - 4);
        }
        ctx.restore();
      }

      function drawNoel(elapsed) {
        if (!noelReady) {
          drawFallbackNoel(elapsed);
          return;
        }

        const frameW = 128;
        const frameH = 150;
        const frame = Math.floor(elapsed * 12) % 4;
        const row = 1;
        const targetH = 95;
        const targetW = targetH * (frameW / frameH);
        const screenX = W - player.x;
        const y = player.y - targetH / 2 + Math.sin(elapsed * 18) * 1.6;

        ctx.save();
        ctx.imageSmoothingEnabled = true;
        ctx.fillStyle = "rgba(0, 0, 0, 0.38)";
        ctx.fillRect(screenX - 31, y + targetH - 5, 62, 9);
        ctx.translate(screenX, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(noelImage, frame * frameW, row * frameH, frameW, frameH, -targetW / 2, y, targetW, targetH);
        ctx.restore();
      }

      function drawRei(elapsed) {
        const frame = Math.floor(elapsed / 0.5) % 2;
        const image = reiImages[frame];
        if (!reiReady[frame]) return;

        const source = { x: 222, y: 299, w: 802, h: 1005 };
        const targetH = H;
        const targetW = targetH * (source.w / source.h);
        const x = W - targetW + 160;
        const y = 0;

        ctx.save();
        ctx.imageSmoothingEnabled = true;
        ctx.drawImage(image, source.x, source.y, source.w, source.h, x, y, targetW, targetH);
        ctx.restore();
      }

      function getNiallScreenX(niall, waveElapsed, wave) {
        return niall.startScreenX + waveElapsed * wave.speed;
      }

      function drawNiallWave(elapsed) {
        if (!niallReady) return;

        const cols = [[0, 204], [204, 399], [399, 590], [590, 793]];
        const row = [280, 541];
        const sourceH = row[1] - row[0];
        niallWaves.forEach((wave) => {
          const waveElapsed = elapsed - wave.start;
          if (waveElapsed < 0 || waveElapsed > wave.duration) return;
          wave.nialls.forEach((niall) => {
            const screenX = getNiallScreenX(niall, waveElapsed, wave);
            if (screenX < -120 || screenX > W + 140) return;
            const frame = Math.floor((waveElapsed * 10 + niall.phase) % cols.length);
            const col = cols[frame];
            const sourceW = col[1] - col[0];
            const targetH = 102 * niall.scale;
            const targetW = targetH * (sourceW / sourceH) * 0.92;
            const bob = Math.sin((waveElapsed + niall.phase) * 18) * 2;
            const y = niall.y - targetH / 2 + bob;

            ctx.save();
            ctx.imageSmoothingEnabled = true;
            ctx.fillStyle = "rgba(0, 0, 0, 0.34)";
            ctx.fillRect(screenX - targetW * 0.34, y + targetH - 8, targetW * 0.68, 9);
            ctx.translate(screenX, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(niallImage, col[0], row[0], sourceW, sourceH, -targetW / 2, y, targetW, targetH);
            ctx.restore();
          });
        });
      }

      function clampPlayer() {
        player.x = Math.min(playBounds.right - player.r, Math.max(playBounds.left + player.r, player.x));
        player.y = Math.min(playBounds.bottom - player.r, Math.max(playBounds.top + player.r, player.y));
      }

      function updatePlayer(dt) {
        let dx = 0;
        let dy = 0;

        if (keys.has("arrowleft") || keys.has("a")) dx += 1;
        if (keys.has("arrowright") || keys.has("d")) dx -= 1;
        if (keys.has("arrowup") || keys.has("w")) dy -= 1;
        if (keys.has("arrowdown") || keys.has("s")) dy += 1;

        dx -= stickInput.x;
        dy += stickInput.y;

        const mag = Math.hypot(dx, dy);
        if (mag > 0) {
          player.x += (dx / mag) * player.speed * dt;
          player.y += (dy / mag) * player.speed * dt;
        }

        clampPlayer();
      }

      function applyObstacleCollisions(elapsed) {
        obstacles.forEach((obstacle) => {
          const x = obstacle.startX - elapsed * obstacleSpeed;
          const halfW = obstacle.w / 2;
          const halfH = obstacle.h / 2;
          const closestX = Math.max(x - halfW, Math.min(player.x, x + halfW));
          const closestY = Math.max(obstacle.y - halfH, Math.min(player.y, obstacle.y + halfH));
          const distX = player.x - closestX;
          const distY = player.y - closestY;
          const distSq = distX * distX + distY * distY;

          if (distSq >= player.r * player.r) return;

          const overlapX = player.x < x ? player.x + player.r - (x - halfW) : x + halfW - (player.x - player.r);
          const overlapY =
            player.y < obstacle.y
              ? player.y + player.r - (obstacle.y - halfH)
              : obstacle.y + halfH - (player.y - player.r);

          if (overlapX < overlapY) {
            player.x += player.x < x ? -overlapX : overlapX;
          } else {
            player.y += player.y < obstacle.y ? -overlapY : overlapY;
          }

          if (x < player.x + player.r + halfW && x > player.x - player.r - halfW) {
            player.x -= obstacleSpeed * 0.012;
          }
        });

        if (player.x - player.r <= playBounds.left + 2) {
          gameState = "gameover";
          timerEl.textContent = "00";
        }

        clampPlayer();
      }

      function pushPlayerOutOfRect(centerX, centerY, width, height, pushX = 0) {
        const halfW = width / 2;
        const halfH = height / 2;
        const closestX = Math.max(centerX - halfW, Math.min(player.x, centerX + halfW));
        const closestY = Math.max(centerY - halfH, Math.min(player.y, centerY + halfH));
        const distX = player.x - closestX;
        const distY = player.y - closestY;
        const distSq = distX * distX + distY * distY;

        if (distSq >= player.r * player.r) return false;

        const overlapX =
          player.x < centerX ? player.x + player.r - (centerX - halfW) : centerX + halfW - (player.x - player.r);
        const overlapY =
          player.y < centerY ? player.y + player.r - (centerY - halfH) : centerY + halfH - (player.y - player.r);

        if (overlapX < overlapY) {
          player.x += player.x < centerX ? -overlapX : overlapX;
        } else {
          player.y += player.y < centerY ? -overlapY : overlapY;
        }
        player.x += pushX;
        return true;
      }

      function applyNiallCollisions(elapsed) {
        niallWaves.forEach((wave) => {
          const waveElapsed = elapsed - wave.start;
          if (waveElapsed < 0 || waveElapsed > wave.duration) return;
          wave.nialls.forEach((niall) => {
            const screenX = getNiallScreenX(niall, waveElapsed, wave);
            if (screenX < -130 || screenX > W + 150) return;
            const worldX = W - screenX;
            const height = 68 * niall.scale;
            const width = 34 * niall.scale;
            if (pushPlayerOutOfRect(worldX, niall.y + 12, width, height, -wave.speed * 0.009)) {
              clampPlayer();
            }
          });
        });
      }

      function drawEndMessage(title, subtitle) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.58)";
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = "#f4fbff";
        ctx.font = "26px 'Press Start 2P', monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(title, W / 2, H / 2 - 18);
        ctx.font = "14px 'Press Start 2P', monospace";
        ctx.fillText(subtitle, W / 2, H / 2 + 34);
      }

      function frame(now) {
        const controlsActive = gameState === "running";
        controls.hidden = !controlsActive;
        stick.style.pointerEvents = controlsActive ? "auto" : "none";
        const elapsed = Math.min(duration, (now - startTime) / 1000);
        const dt = Math.min(0.04, (now - lastFrameTime) / 1000);
        lastFrameTime = now;
        const remaining = Math.max(0, Math.ceil(duration - elapsed));

        if (remaining !== lastTimer) {
          lastTimer = remaining;
          timerEl.textContent = String(remaining).padStart(2, "0");
        }

        if (gameState === "running") {
          updatePlayer(dt);
          applyObstacleCollisions(elapsed);
          applyNiallCollisions(elapsed);
        }

        drawBackground(elapsed);
        obstacles.forEach((obstacle) => {
          const x = obstacle.startX - elapsed * obstacleSpeed;
          if (x > -obstacle.w && x < W + obstacle.w) {
            drawObstacle(obstacle, elapsed);
          }
        });
        drawNiallWave(elapsed);
        drawNoel(elapsed);
        drawRei(elapsed);

        if (gameState === "gameover") {
          drawEndMessage("GAME OVER", "Tap anywhere to continue");
          return;
        }

        if (elapsed >= duration) {
          gameState = "complete";
          drawEndMessage("YOU SURVIVED", "Tap to continue");
          return;
        }

        requestAnimationFrame(frame);
      }

      function restartRun() {
        player.x = W + 100;
        player.y = H * 0.63;
        keys.clear();
        resetStick();
        gameState = "running";
        startTime = performance.now();
        lastFrameTime = startTime;
        lastTimer = duration;
        timerEl.textContent = String(duration).padStart(2, "0");
        requestAnimationFrame(frame);
      }

      window.addEventListener("keydown", (event) => {
        if (gameState === "complete") {
          event.preventDefault();
          reloadWrapperForLevelStart(1);
          return;
        }
        if (gameState === "gameover") {
          event.preventDefault();
          restartRun();
          return;
        }
        keys.add(event.key.toLowerCase());
      });

      window.addEventListener("keyup", (event) => {
        keys.delete(event.key.toLowerCase());
      });

      function setStickFromPoint(clientX, clientY) {
        const rect = stick.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        const max = rect.width * 0.34;
        const dx = clientX - cx;
        const dy = clientY - cy;
        const mag = Math.hypot(dx, dy);
        const clamped = Math.min(max, mag);
        const nx = mag ? dx / mag : 0;
        const ny = mag ? dy / mag : 0;
        stickInput.x = (nx * clamped) / max;
        stickInput.y = (ny * clamped) / max;
        knob.style.transform = `translate(calc(-50% + ${nx * clamped}px), calc(-50% + ${ny * clamped}px))`;
      }

      function resetStick() {
        stickInput.x = 0;
        stickInput.y = 0;
        activeStickPointerId = null;
        knob.style.transform = "translate(-50%, -50%)";
      }

      // No setPointerCapture: the page is touch-action:none / overflow:hidden, so the
      // window-level pointermove/up/cancel listeners already track the finger by id.
      // Capture only risked getting stuck across the fridge -> run navigation and
      // killing the joystick (which makes the runner instantly unplayable).
      stick.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        activeStickPointerId = event.pointerId;
        setStickFromPoint(event.clientX, event.clientY);
      });
      window.addEventListener("pointermove", (event) => {
        if (event.pointerId !== activeStickPointerId) return;
        event.preventDefault();
        setStickFromPoint(event.clientX, event.clientY);
      });
      window.addEventListener("pointerup", (event) => {
        if (event.pointerId === activeStickPointerId) resetStick();
      });
      window.addEventListener("pointercancel", (event) => {
        if (event.pointerId === activeStickPointerId) resetStick();
      });

      let lastPressHandledAt = 0;
      function handleRunPress(event) {
        if (controls.contains(event.target)) return false;
        const now = performance.now();
        if (now - lastPressHandledAt < 260) return false;
        if (gameState === "complete") {
          reloadWrapperForLevelStart(1);
          lastPressHandledAt = now;
          return true;
        }
        if (gameState === "gameover") {
          restartRun();
          lastPressHandledAt = now;
          return true;
        }
        return false;
      }

      ["pointerdown", "touchend", "click"].forEach((type) => {
        window.addEventListener(type, (event) => {
          if (handleRunPress(event)) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, { capture: true });
      });

      document.fonts?.load("18px 'Press Start 2P'").catch(() => {});
      timerEl.textContent = String(duration).padStart(2, "0");
      buildObstacles();
      buildNiallWaves();
      requestAnimationFrame(frame);
    </script>
  </body>
</html>
